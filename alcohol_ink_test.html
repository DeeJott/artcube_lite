<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alcohol Ink Shader v8</title>
<style>
  * { margin: 0; padding: 0; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.175.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vertexShader = `
varying vec2 vUv;
void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const fragmentShader = `
precision highp float;
varying vec2 vUv;
uniform float uTime;
uniform vec2 uResolution;
uniform vec2 uMouse;

float hash(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
    return mix(
        mix(hash(i), hash(i + vec2(1, 0)), u.x),
        mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x),
        u.y
    );
}

float fbm(vec2 p) {
    return 0.6 * noise(p) + 0.4 * noise(p * 2.03 + 1.7);
}

// Domain warp
float warpedField(vec2 p, float t) {
    p *= 0.7;
    
    vec2 q = vec2(
        fbm(p + vec2(0.0, 0.0) + t * 0.4),
        fbm(p + vec2(5.2, 1.3) + t * 0.3)
    );
    
    vec2 r = vec2(
        fbm(p + 2.5 * q + vec2(1.7, 9.2) + t * 0.15),
        fbm(p + 2.5 * q + vec2(8.3, 2.8) + t * 0.1)
    );
    
    return fbm(p + 2.5 * r);
}

vec3 palette(float t) {
    t = clamp(t, 0.0, 1.0);
    
    vec3 col;
    if (t < 0.15) {
        col = mix(vec3(0.0), vec3(0.15, 0.01, 0.06), t / 0.15);
    } else if (t < 0.3) {
        col = mix(vec3(0.15, 0.01, 0.06), vec3(0.45, 0.04, 0.10), (t - 0.15) / 0.15);
    } else if (t < 0.5) {
        col = mix(vec3(0.45, 0.04, 0.10), vec3(0.72, 0.15, 0.22), (t - 0.3) / 0.2);
    } else if (t < 0.7) {
        col = mix(vec3(0.72, 0.15, 0.22), vec3(0.92, 0.55, 0.58), (t - 0.5) / 0.2);
    } else if (t < 0.85) {
        col = mix(vec3(0.92, 0.55, 0.58), vec3(0.97, 0.82, 0.84), (t - 0.7) / 0.15);
    } else {
        col = mix(vec3(0.97, 0.82, 0.84), vec3(1.0, 0.97, 0.97), (t - 0.85) / 0.15);
    }
    return col;
}

void main() {
    float aspect = uResolution.x / uResolution.y;
    vec2 uv = vUv;
    vec2 p = (uv - 0.5) * vec2(aspect, 1.0);
    
    // Minimal mouse warp
    vec2 mo = (uMouse - 0.5) * vec2(aspect, 1.0);
    float md = length(p - mo);
    p += smoothstep(0.5, 0.0, md) * 0.02 * (p - mo);
    
    float t = uTime * 0.01;
    
    // Get warped field values
    float f1 = warpedField(p, t);
    float f2 = warpedField(p + vec2(11.3, 7.7), t);
    
    // Concentric banding with sharper step transitions (less soft)
    float frequency = 12.0;
    float band1 = sin(f1 * frequency);
    float band2 = sin(f2 * (frequency * 0.8));
    
    // Sharpen the bands using smoothstep
    float banded1 = smoothstep(0.25, 0.75, band1 * 0.5 + 0.5);
    float banded2 = smoothstep(0.25, 0.75, band2 * 0.5 + 0.5);
    
    // Mix smooth gradients and sharp bands
    float mixed1 = mix(f1, banded1, 0.65);
    float mixed2 = mix(f2, banded2, 0.55);
    
    // Map to palette
    vec3 col1 = palette(mixed1);
    vec3 col2 = palette(mixed2);
    vec3 col = mix(col1, col2, 0.25);
    
    // High-contrast concentrated pigment edges (the dark rings)
    // Draw a sharp line where the sine wave crosses zero
    float edge1 = smoothstep(0.07, 0.0, abs(band1));
    float edge2 = smoothstep(0.07, 0.0, abs(band2));
    
    // Apply dark lines to color
    col = mix(col, vec3(0.08, 0.01, 0.03), edge1 * 0.65);
    col = mix(col, vec3(0.08, 0.01, 0.03), edge2 * 0.45);
    
    // ---- Organic mask ----
    vec2 mp = (uv - 0.5) * 2.0;
    mp.x *= aspect;
    float dist = length(mp * vec2(0.5, 0.65));
    float maskWarp = noise(mp * 0.7 + uTime * 0.004) * 0.3
                   + noise(mp * 1.4 + uTime * 0.003 + 30.0) * 0.12;
    float mask = 1.0 - smoothstep(0.25, 0.8, dist + maskWarp - 0.15);
    
    // Edge wisps
    float edgeZone = smoothstep(0.5, 0.7, dist + maskWarp) * smoothstep(0.9, 0.7, dist + maskWarp);
    float edgeNoise = noise(mp * 3.5 + uTime * 0.006);
    mask += edgeZone * step(0.4, edgeNoise) * 0.35;
    
    col *= clamp(mask, 0.0, 1.0);
    
    // Brighten highlights
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    col += col * smoothstep(0.2, 0.5, lum) * 0.3;
    
    gl_FragColor = vec4(col, 1.0);
}`;

const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    },
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

window.addEventListener('pointermove', (e) => {
    material.uniforms.uMouse.value.set(
        e.clientX / window.innerWidth,
        1.0 - e.clientY / window.innerHeight
    );
});

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});

const startTime = performance.now();
(function animate() {
    requestAnimationFrame(animate);
    material.uniforms.uTime.value = (performance.now() - startTime) * 0.001;
    renderer.render(scene, camera);
})();
</script>
</body>
</html>
