<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magenta Domain Warping Experience - Art Cube</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Centered Main Canvas Container inside Black Frame */
    #canvas-container {
      width: calc(100vw - 64px);
      height: calc(100vh - 64px);
      position: relative;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Centered WebGL Canvas inside Moderately Wide Black Frame -->
  <div id="canvas-container"></div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- 1. Scene & Renderer setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    container.appendChild(renderer.domElement);

    // --- 2. Procedural 256x256 Noise DataTexture for iChannel0 ---
    function createNoiseTexture() {
      const size = 256;
      const data = new Uint8Array(size * size * 4);
      for (let i = 0; i < size * size; i++) {
        const val = Math.floor(Math.random() * 256);
        data[i * 4] = val;
        data[i * 4 + 1] = val;
        data[i * 4 + 2] = val;
        data[i * 4 + 3] = 255;
      }
      const texture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.needsUpdate = true;
      return texture;
    }

    const noiseTexture = createNoiseTexture();

    // --- 3. GLSL Shaders ---
    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      uniform vec3 iResolution;
      uniform float iTime;
      uniform vec4 iMouse;
      uniform sampler2D iChannel0;

      // domain warping based on the master's notes at https://iquilezles.org/articles/warp

      // NOISE ////
      vec2 hash2( float n )
      {
          return fract(sin(vec2(n,n+1.0))*vec2(13.5453123,31.1459123));
      }

      float noise( in vec2 x )
      {
          vec2 p = floor(x);
          vec2 f = fract(x);
          f = f*f*(3.0-2.0*f);
          float a = textureLod(iChannel0,(p+vec2(0.5,0.5))/256.0,0.0).x;
          float b = textureLod(iChannel0,(p+vec2(1.5,0.5))/256.0,0.0).x;
          float c = textureLod(iChannel0,(p+vec2(0.5,1.5))/256.0,0.0).x;
          float d = textureLod(iChannel0,(p+vec2(1.5,1.5))/256.0,0.0).x;
          return mix(mix( a, b,f.x), mix( c, d,f.x),f.y);
      }

      const mat2 mtx = mat2( 0.80,  0.60, -0.60,  0.80 );

      float fbm( vec2 p )
      {
          float f = 0.0;

          f += 0.500000*noise( p ); p = mtx*p*2.02;
          f += 0.250000*noise( p ); p = mtx*p*2.03;
          f += 0.125000*noise( p ); p = mtx*p*2.01;
          f += 0.062500*noise( p ); p = mtx*p*2.04;
          f += 0.031250*noise( p ); p = mtx*p*2.01;
          f += 0.015625*noise( p );

          return f/0.96875;
      }

      // -----------------------------------------------------------------------

      float pattern(in vec2 p, in float t, in vec2 uv, out vec2 q, out vec2 r, out vec2 g)
      {
          q = vec2(fbm(p), fbm(p + vec2(10, 1.3)));
          
          float s = dot(uv.x + 0.5, uv.y + 0.5);
          r = vec2(fbm(p + 4.0 * q + vec2(t) + vec2(1.7, 9.2)), fbm(p + 4.0 * q + vec2(t) + vec2(8.3, 2.8)));
          g = vec2(fbm(p + 2.0 * r + vec2(t * 20.0) + vec2(2, 6)), fbm(p + 2.0 * r + vec2(t * 10.0) + vec2(5, 3)));
          return fbm(p + 5.5 * g + vec2(-t * 7.0));
      }

      void mainImage( out vec4 fragColor, in vec2 fragCoord )
      {
          // Normalized pixel coordinates (from 0 to 1 across full canvas buffer)
          vec2 uv = fragCoord / iResolution.xy;
          
          // noise
          vec2 q, r, g;
          float noiseVal = pattern(fragCoord * vec2(.004), iTime * 0.007, uv, q, r, g);
          
          // --- SHIBUYA S-ARTWORK MAGENTA COLOR SYSTEM (-20% Brightness) ---
          // Base color in deep metallic cherry-fuchsia gradations
          vec3 col = mix(vec3(0.05, 0.00, 0.02), vec3(0.74, 0.00, 0.36), smoothstep(0.0, 1.0, noiseVal));
          
          // Layer 1: Deep velvet wine/burgundy tones in domain warp core
          col = mix(col, vec3(0.28, 0.00, 0.13), dot(q, q) * 1.0);
          
          // Layer 2: Vivid fuchsia-cherry neon highlights (-20% brightness)
          col = mix(col, vec3(0.80, 0.04, 0.44), 0.35 * g.y * g.y);
          
          // Layer 3: Metallic cherry-magenta specular midtones
          col = mix(col, vec3(0.48, 0.00, 0.24), smoothstep(0.0, 0.6, 0.6 * r.g * r.g));
          
          // Layer 4: Soft pale pink Sakura flares on turbulence ridges
          col = mix(col, vec3(0.80, 0.36, 0.62), 0.12 * g.x);
          
          // Dark contrast outlines (fading directly to deep black vec3(0))
          col = mix(col, vec3(0.0), smoothstep(0.3, 0.5, noiseVal) * smoothstep(0.5, 0.3, noiseVal));
          col = mix(col, vec3(0.0), smoothstep(0.7, 0.8, noiseVal) * smoothstep(0.8, 0.7, noiseVal));
          
          // Contrast depth & metallic vibrancy boost (-20% overall gain: 2.1 * 0.8 = 1.68)
          col *= noiseVal * 1.68;
          
          // Vignette towards pitch black borders
          col *= 0.70 + 0.65 * sqrt(70.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y));
          
          // Output to screen
          fragColor = vec4(col, 1.0);
      }

      void main() {
          mainImage(gl_FragColor, gl_FragCoord.xy);
      }
    `;

    // --- 4. Uniforms & Material ---
    const uniforms = {
      iResolution: { value: new THREE.Vector3(1, 1, 1) },
      iTime: { value: 0 },
      iMouse: { value: new THREE.Vector4() },
      iChannel0: { value: noiseTexture }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      uniforms: uniforms,
      depthWrite: false,
      depthTest: false
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // --- 5. Resize & Layout Logic ---
    function updateSize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      const pixelRatio = Math.min(window.devicePixelRatio, 2);
      
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(width, height);
      
      // Update iResolution to match exact physical WebGL drawing buffer dimensions
      const canvas = renderer.domElement;
      uniforms.iResolution.value.set(canvas.width, canvas.height, 1);
    }

    updateSize();
    window.addEventListener('resize', updateSize);

    // Fixed default speed factor
    const speedFactor = 1.0;

    // Mouse tracking
    window.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      const pixelRatio = Math.min(window.devicePixelRatio, 2);
      uniforms.iMouse.value.x = (e.clientX - rect.left) * pixelRatio;
      uniforms.iMouse.value.y = (rect.height - (e.clientY - rect.top)) * pixelRatio;
    });

    // --- 6. Render Loop ---
    let clock = new THREE.Clock();
    let totalTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      totalTime += delta * speedFactor;
      uniforms.iTime.value = totalTime;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
