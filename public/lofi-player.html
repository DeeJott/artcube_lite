<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Audio Experience - Inspired by Dryhope "Contrasts"</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: rgba(22, 24, 37, 0.75);
            --accent-orange: #ff8c53;
            --accent-purple: #9d65ff;
            --accent-cyan: #4ee2ec;
            --text-main: #f0f2f8;
            --text-muted: #8c93b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 140, 83, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(157, 101, 255, 0.15), transparent 40%);
        }

        .container {
            width: 90%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            position: relative;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-main), var(--accent-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 140, 83, 0.15);
            border: 1px solid rgba(255, 140, 83, 0.3);
            border-radius: 20px;
            color: var(--accent-orange);
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        /* Vinyl & Visualizer Area */
        .visualizer-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #visualizerCanvas {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 320px;
            height: 320px;
            z-index: 1;
            pointer-events: none;
        }

        .vinyl-record {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #111 0%, #222 30%, #111 31%, #1e1e1e 60%, #0d0d0d 100%);
            border: 4px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.1);
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }

        .vinyl-record.playing {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .vinyl-label {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff8c53, #9d65ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
            position: relative;
        }

        .vinyl-center-hole {
            width: 14px;
            height: 14px;
            background: var(--bg-color);
            border-radius: 50%;
            position: absolute;
        }

        /* Controls Section */
        .controls-card {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .progress-bar-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-purple));
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .buttons-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
        }

        .btn-play {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-orange), #e66f33);
            border: none;
            box-shadow: 0 8px 20px rgba(255, 140, 83, 0.4);
        }

        .btn-play:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 25px rgba(255, 140, 83, 0.6);
        }

        .btn svg {
            fill: currentColor;
        }

        /* Track Info Details */
        .track-details {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .detail-item .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-item .val {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Contrasts (Dryhope Inspired)</h1>
            <p>Lo-Fi Chillhop Ambient Track • Custom Synthesized</p>
            <div class="badge">AUDIO ARTWORK GENERATED</div>
        </div>

        <div class="visualizer-wrapper">
            <canvas id="visualizerCanvas" width="320" height="320"></canvas>
            <div class="vinyl-record" id="vinyl">
                <div class="vinyl-label">
                    <span>DRYHOPE</span>
                    <div class="vinyl-center-hole"></div>
                </div>
            </div>
        </div>

        <div class="controls-card">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-labels">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="buttons-row">
                <button class="btn" id="btnRewind" title="Neu starten">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button class="btn btn-play" id="btnPlay" title="Abspielen / Pause">
                    <svg id="playIcon" width="26" height="26" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" width="26" height="26" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn" id="btnLoop" title="Schleife aktivieren/deaktivieren" style="color: var(--accent-orange);">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                </button>
            </div>
        </div>

        <div class="track-details">
            <div class="detail-item">
                <div class="label">Tempo & Tonart</div>
                <div class="val">76 BPM • E♭ Major / C Minor</div>
            </div>
            <div class="detail-item">
                <div class="label">Instrumentierung</div>
                <div class="val">Lo-Fi Rhodes, Sub-Bass, Pluck</div>
            </div>
            <div class="detail-item">
                <div class="label">Texturen & Groove</div>
                <div class="val">Dusty Vinyl Crackle, Swing Hats</div>
            </div>
        </div>
    </div>

    <!-- Hidden audio tag pointing to generated WAV file -->
    <audio id="audioPlayer" src="media/contrasts_dryhope_inspired.wav" preload="auto"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const btnPlay = document.getElementById('btnPlay');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const btnRewind = document.getElementById('btnRewind');
        const vinyl = document.getElementById('vinyl');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');

        let audioCtx, analyser, source, dataArray;
        let isAudioSetup = false;

        function setupAudioContext() {
            if (isAudioSetup) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isAudioSetup = true;
            drawVisualizer();
        }

        function formatTime(secs) {
            if (isNaN(secs)) return "0:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        btnPlay.addEventListener('click', () => {
            setupAudioContext();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                vinyl.classList.add('playing');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                vinyl.classList.remove('playing');
            }
        });

        btnRewind.addEventListener('click', () => {
            audio.currentTime = 0;
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${pct}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('ended', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            vinyl.classList.remove('playing');
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        // Visualizer Ring Animation
        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!isAudioSetup) return;

            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 120;

            const bars = dataArray.length;
            for (let i = 0; i < bars; i++) {
                const value = dataArray[i];
                const barHeight = (value / 255) * 35;
                const rad = (i / bars) * Math.PI * 2;

                const x1 = centerX + Math.cos(rad) * radius;
                const y1 = centerY + Math.sin(rad) * radius;
                const x2 = centerX + Math.cos(rad) * (radius + barHeight);
                const y2 = centerY + Math.sin(rad) * (radius + barHeight);

                ctx.strokeStyle = `hsl(${20 + i * 8}, 100%, 65%)`;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
        }
    </script>
</body>
</html>
