<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura: Reborn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #08000c;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Layer 1: Metallic Magenta Background Canvas */
    #bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
    }

    #bg-container canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* Layer 2: 3D Artwork Canvas */
    #webgl-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      cursor: none;
      /* Custom user cursor elements used */
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease-in-out;
    }

    #webgl-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    #webgl-container canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* Custom Translucent User Cursors */
    .user-cursor {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.3s ease;
      opacity: 0;
    }

    .user-cursor.active {
      opacity: 1;
    }

    .cursor-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background-color: var(--user-color-alpha, rgba(0, 240, 255, 0.35));
      box-shadow: 0 0 16px var(--user-color-glow, rgba(0, 240, 255, 0.6));
      position: relative;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
    }

    .cursor-circle.gesture-active {
      transform: scale(1.38);
      box-shadow: 0 0 30px var(--user-color-glow, rgba(0, 240, 255, 0.95)), 0 0 45px rgba(255, 255, 255, 0.9);
    }

    .cursor-circle.gesture-click {
      animation: cursorClickPulse 0.4s ease-out;
    }

    @keyframes cursorClickPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.45);
      }

      100% {
        transform: scale(1);
      }
    }

    .gesture-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--user-color-glow, rgba(0, 240, 255, 0.9));
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;
      opacity: 1;
      animation: gestureRingExpand 0.6s ease-out forwards;
    }

    @keyframes gestureRingExpand {
      0% {
        width: 32px;
        height: 32px;
        opacity: 0.95;
        border-width: 3px;
      }

      100% {
        width: 110px;
        height: 110px;
        opacity: 0;
        border-width: 1px;
      }
    }

    .cursor-circle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background-color: #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px #ffffff;
    }

    .cursor-name {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 10px var(--user-color-glow, rgba(0, 240, 255, 0.8));
      white-space: nowrap;
      padding: 2px 8px;
      background: rgba(18, 12, 28, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      border: 1px solid var(--user-color-glow, rgba(0, 240, 255, 0.4));
    }

    /* Start Overlay Lobby Card */
    .lobby-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: rgba(8, 0, 12, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .lobby-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .lobby-card {
      width: 100%;
      max-width: 480px;
      background: rgba(18, 12, 28, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 105, 180, 0.4);
      border-radius: 32px;
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 42, 157, 0.25);
      display: flex;
      flex-direction: column;
      gap: 28px;
      animation: lobbyPulseGlow 3s infinite ease-in-out;
    }

    @keyframes lobbyPulseGlow {

      0%,
      100% {
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 35px rgba(255, 42, 157, 0.25);
      }

      50% {
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7), 0 0 50px rgba(255, 42, 157, 0.45);
      }
    }

    .lobby-brand {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lobby-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ff80df 50%, #ff2a9d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 42, 157, 0.6);
    }

    .lobby-subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(255, 200, 235, 0.75);
      text-transform: uppercase;
      font-weight: 500;
    }

    .lobby-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label,
    .invite-group label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 180, 220, 0.85);
      font-weight: 600;
    }

    .name-input {
      width: 100%;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 105, 180, 0.35);
      border-radius: 16px;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.3s ease;
    }

    .name-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #ff2a9d;
      box-shadow: 0 0 15px rgba(255, 42, 157, 0.4);
    }

    .invite-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .invite-actions {
      display: flex;
      gap: 10px;
    }

    .invite-btn,
    .guest-toggle-btn {
      flex: 1;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(78, 226, 236, 0.4);
      border-radius: 16px;
      color: rgba(255, 255, 255, 0.9);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .join-btn {
      width: 100%;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.3) 0%, rgba(18, 12, 28, 0.9) 100%);
      border: 1px solid rgba(78, 226, 236, 0.8);
      border-radius: 16px;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.35);
    }

    .join-btn:hover {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.5) 0%, rgba(78, 226, 236, 0.4) 100%);
      border-color: #4ee2ec;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.55);
    }

    .join-btn.joined {
      background: linear-gradient(135deg, rgba(0, 255, 163, 0.3) 0%, rgba(18, 12, 28, 0.9) 100%);
      border-color: #00ffa3;
      color: #00ffa3;
      box-shadow: 0 0 15px rgba(0, 255, 163, 0.4);
    }

    .invite-btn:hover,
    .guest-toggle-btn:hover {
      background: rgba(78, 226, 236, 0.2);
      border-color: #4ee2ec;
      color: #ffffff;
      transform: translateY(-2px);
    }

    .guest-toggle-btn.active {
      background: rgba(255, 42, 157, 0.25);
      border-color: #ff2a9d;
      color: #ffffff;
    }

    .participants-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .participant-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #ffffff;
      transition: opacity 0.3s ease;
    }

    .participant-item.disabled {
      opacity: 0.4;
    }

    .p-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .p-name {
      flex: 1;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .p-status {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .start-artwork-btn {
      width: 100%;
      padding: 16px 28px;
      background: linear-gradient(135deg, rgba(255, 42, 157, 0.8) 0%, rgba(18, 12, 28, 0.9) 100%);
      border: 1px solid rgba(78, 226, 236, 0.8);
      border-radius: 24px;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 42, 157, 0.4), 0 0 20px rgba(78, 226, 236, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .start-artwork-btn:hover {
      transform: translateY(-3px) scale(1.02);
      background: linear-gradient(135deg, rgba(255, 42, 157, 0.95) 0%, rgba(78, 226, 236, 0.4) 100%);
      border-color: #4ee2ec;
      box-shadow: 0 15px 40px rgba(255, 42, 157, 0.6), 0 0 30px rgba(78, 226, 236, 0.5);
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(18, 12, 28, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(78, 226, 236, 0.6);
      padding: 10px 22px;
      border-radius: 20px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Modern Glassmorphic HUD Layout */
    .hud-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 36px;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .hud-layer.active {
      opacity: 1;
    }

    /* Top Info Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Top Left Instruction Box */
    .instruction-box {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 20px;
      background: rgba(18, 12, 28, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 105, 180, 0.4);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      max-width: 440px;
    }

    .instruction-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .instruction-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff2a9d;
      box-shadow: 0 0 10px #ff2a9d;
      animation: pulsePhase 2s infinite ease-in-out;
    }

    .phase-title {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(255, 180, 220, 0.95);
    }

    .instruction-body {
      font-size: 13px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
    }

    /* Top Right Control Buttons (Sound ON/OFF, Pause/Play, Restart) */
    .hud-control-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(18, 12, 28, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 105, 180, 0.4);
      border-radius: 20px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .hud-control-btn:hover {
      background: rgba(255, 42, 157, 0.3);
      border-color: #ff2a9d;
      box-shadow: 0 0 15px rgba(255, 42, 157, 0.5);
      transform: translateY(-1px);
    }

    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    transition: all 0.3s ease;
    }

    .user-switch-toggle:hover {
      background: rgba(78, 226, 236, 0.2);
      border-color: #4ee2ec;
      transform: translateY(-1px);
    }

    @keyframes pulsePhase {

      0%,
      100% {
        opacity: 0.4;
        transform: scale(0.9);
      }

      50% {
        opacity: 1.0;
        transform: scale(1.2);
      }
    }

    /* Bottom HUD Container */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    /* Bottom Left: Title & Subtitle */
    .brand-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 42, 157, 0.7), 0 0 40px rgba(255, 105, 180, 0.4);
      background: linear-gradient(135deg, #ffffff 0%, #ff80df 50%, #ff2a9d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 11px;
      letter-spacing: 2.5px;
      color: rgba(255, 200, 235, 0.75);
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Bottom Center: Creation Action Button */
    .center-action {
      pointer-events: auto;
    }

    .create-btn {
      position: relative;
      padding: 16px 36px;
      background: rgba(18, 12, 28, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 105, 180, 0.3);
      border-radius: 36px;
      color: rgba(255, 255, 255, 0.5);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: not-allowed;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    /* Button Countdown Progress Overlay */
    .create-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--progress-width, 0%);
      background: linear-gradient(90deg, rgba(255, 42, 157, 0.25), rgba(78, 226, 236, 0.25));
      border-radius: 36px;
      transition: width 0.3s linear;
      z-index: 0;
    }

    .btn-content {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .timer-badge {
      font-family: monospace;
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Enabled Active Button State */
    .create-btn.active {
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, rgba(255, 42, 157, 0.35) 0%, rgba(18, 12, 28, 0.9) 100%);
      border-color: rgba(78, 226, 236, 0.8);
      box-shadow: 0 12px 35px rgba(255, 42, 157, 0.4), 0 0 25px rgba(78, 226, 236, 0.3);
      animation: pulseBtnGlow 2.5s infinite ease-in-out;
    }

    .create-btn.active:hover {
      transform: translateY(-3px) scale(1.03);
      background: linear-gradient(135deg, rgba(255, 42, 157, 0.55) 0%, rgba(78, 226, 236, 0.3) 100%);
      border-color: #4ee2ec;
      box-shadow: 0 16px 45px rgba(255, 42, 157, 0.6), 0 0 35px rgba(78, 226, 236, 0.5);
    }

    @keyframes pulseBtnGlow {

      0%,
      100% {
        box-shadow: 0 10px 30px rgba(255, 42, 157, 0.3), 0 0 20px rgba(78, 226, 236, 0.2);
      }

      50% {
        box-shadow: 0 14px 40px rgba(255, 42, 157, 0.6), 0 0 30px rgba(78, 226, 236, 0.5);
      }
    }

    /* Bottom Center: 3 Mode Selection Navigation Pill Buttons (Blüten, Plexus, Wald) */
    .mode-selector-container {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .mode-selector-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 180, 220, 0.7);
      font-weight: 600;
    }

    .mode-selector {
      display: flex;
      gap: 8px;
      background: rgba(18, 12, 28, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px;
      border-radius: 24px;
      border: 1px solid rgba(255, 105, 180, 0.3);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
    }

    .mode-btn {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 18px;
      color: rgba(255, 200, 235, 0.6);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn:hover:not(.disabled) {
      color: #ffffff;
      background: rgba(255, 105, 180, 0.2);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, rgba(255, 42, 157, 0.55) 0%, rgba(18, 12, 28, 0.9) 100%);
      color: #ffffff;
      border-color: rgba(255, 180, 220, 0.8);
      box-shadow: 0 0 15px rgba(255, 42, 157, 0.5);
    }

    .mode-btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .mode-btn.unlocked {
      opacity: 1.0;
      cursor: pointer;
      border-color: rgba(78, 226, 236, 0.8);
      color: #4ee2ec;
      animation: pulseWaldUnlocked 2s infinite ease-in-out;
    }

    @keyframes pulseWaldUnlocked {

      0%,
      100% {
        box-shadow: 0 0 10px rgba(78, 226, 236, 0.3);
      }

      50% {
        box-shadow: 0 0 22px rgba(78, 226, 236, 0.8);
      }
    }

    /* Mobile Landscape Laptop 16:9 Aspect Scaling */
    @media (max-width: 950px) and (orientation: landscape) {

      #webgl-container canvas,
      #bg-container canvas {
        max-width: 100vw !important;
        max-height: 100vh !important;
        object-fit: contain !important;
      }
    }
  </style>

  <!-- Three.js & PeerJS WebRTC Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>

  <!-- Audio Element: Multi-Source Contrasts Audio Track -->
  <audio id="bgAudio" loop preload="auto">
    <source src="media/Contrasts-Dryhope.mp3" type="audio/mpeg">
    <source src="/media/Contrasts-Dryhope.mp3" type="audio/mpeg">
    <source src="media/contrasts_dryhope_inspired.wav" type="audio/wav">
    <source src="/media/contrasts_dryhope_inspired.wav" type="audio/wav">
  </audio>

  <!-- Layer 1: Metallic Magenta Background Canvas -->
  <div id="bg-container"></div>

  <!-- Layer 2: 3D Artwork Canvas -->
  <div id="webgl-container"></div>

  <!-- Start Overlay Lobby Card -->

      // GLSL Background Fluid Shader with Dynamic Kaleidoscope AND Linear Grid Vibe Shader for Plexus Finale!
      function createNoiseTexture() {
        const size = 256;
        const data = new Uint8Array(size * size * 4);
        for (let i = 0; i < size * size; i++) {
          const val = Math.floor(Math.random() * 256);
          data[i * 4] = val;
          data[i * 4 + 1] = val;
          data[i * 4 + 2] = val;
          data[i * 4 + 3] = 255;
        }
        const texture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.needsUpdate = true;
        return texture;
      }

      const bgVertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `;

      // BACKGROUND SHADER MIT TRANSPARENTER WASSER-LICHTBRECHUNGS-WELLE (AUS TESTBRANCH FÜR ALLE KUNSTWERKE)
      const bgFragmentShader = `
        uniform vec3 iResolution;
        uniform float iTime;
        uniform sampler2D iChannel0;
        uniform float uKaleidoscope;
        uniform float uGridVibe;
        uniform float uRippleActive;
        uniform float uRippleTime;
        varying vec2 vUv;

        float noise(in vec2 x) {
          vec2 p = floor(x);
          vec2 f = fract(x);
          f = f * f * (3.0 - 2.0 * f);
          float a = texture2D(iChannel0, (p + vec2(0.5, 0.5)) / 256.0).x;
          float b = texture2D(iChannel0, (p + vec2(1.5, 0.5)) / 256.0).x;
          float c = texture2D(iChannel0, (p + vec2(0.5, 1.5)) / 256.0).x;
          float d = texture2D(iChannel0, (p + vec2(1.5, 1.5)) / 256.0).x;
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        const mat2 mtx = mat2(0.80, 0.60, -0.60, 0.80);

        float fbm(vec2 p) {
          float f = 0.0;
          f += 0.500000 * noise(p); p = mtx * p * 2.02;
          f += 0.250000 * noise(p); p = mtx * p * 2.03;
          f += 0.125000 * noise(p); p = mtx * p * 2.01;
          f += 0.062500 * noise(p); p = mtx * p * 2.04;
          f += 0.031250 * noise(p); p = mtx * p * 2.01;
          f += 0.015625 * noise(p);
          return f / 0.96875;
        }

        float pattern(in vec2 p, in float t, in vec2 uv) {
          vec2 q = vec2(fbm(p), fbm(p + vec2(10.0, 1.3)));
          vec2 r = vec2(fbm(p + 4.0 * q + vec2(t) + vec2(1.7, 9.2)), fbm(p + 4.0 * q + vec2(t) + vec2(8.3, 2.8)));
          vec2 g = vec2(fbm(p + 2.0 * r + vec2(t * 20.0) + vec2(2.0, 6.0)), fbm(p + 2.0 * r + vec2(t * 10.0) + vec2(5.0, 3.0)));
          return fbm(p + 5.5 * g + vec2(-t * 7.0));
        }

        void main() {
          vec2 fragCoord = gl_FragCoord.xy;
          vec2 uv = fragCoord / iResolution.xy;
          
          vec2 rippleOffset = vec2(0.0);
          float waveNormal = 0.0;
          float waveFade = 0.0;

          // TRANSPARENTE WASSER-LICHTBRECHUNGS-VERZERRUNG DES HINTERGRUNDS
          if (uRippleActive > 0.5) {
            vec2 centerUv = uv - vec2(0.5);
            centerUv.x *= iResolution.x / iResolution.y;
            float dist = length(centerUv);

            float waveRadius = (uRippleTime / 2.0) * 1.35;
            float waveDist = abs(dist - waveRadius);

            // Physische Wasserwellen-Lichtbrechungs-Normalen
            float wavePhase = waveDist * 35.0 - uRippleTime * 10.0;
            waveNormal = cos(wavePhase) * exp(-waveDist * waveDist * 120.0);
            waveFade = smoothstep(2.0, 1.5, uRippleTime) * smoothstep(0.0, 0.1, uRippleTime);

            // Verzerrungs-Vektor für die Hintergrund-Struktur
            rippleOffset = normalize(centerUv + vec2(0.0001)) * waveNormal * 0.035 * waveFade;
          }

          // Verzerrte Hintergrund-Berechnung durch Wasser-Refraktion
          vec2 distortedFragCoord = fragCoord + rippleOffset * iResolution.xy;
          vec2 distortedUv = uv + rippleOffset;

          // Kaleidoscope Coordinate Symmetry Transformation
          if (uKaleidoscope > 0.001) {
              vec2 p = distortedUv - vec2(0.5);
              float r = length(p);
              float a = atan(p.y, p.x);
              float sides = 6.0;
              float tau = 6.2831853;
              a = mod(a, tau / sides);
              a = abs(a - tau / (2.0 * sides));
              vec2 kUV = vec2(cos(a), sin(a)) * r + vec2(0.5);
              distortedUv = mix(distortedUv, kUV, uKaleidoscope);
          }

          float noiseVal = pattern(distortedFragCoord * vec2(0.004), iTime * 0.007, distortedUv);
          
          vec3 col = mix(vec3(0.05, 0.00, 0.02), vec3(0.74, 0.00, 0.36), smoothstep(0.0, 1.0, noiseVal));
          col = mix(col, vec3(0.28, 0.00, 0.13), noiseVal * 0.8);
          col = mix(col, vec3(0.80, 0.04, 0.44), 0.35 * noiseVal);
          col = mix(col, vec3(0.48, 0.00, 0.24), smoothstep(0.0, 0.6, 0.6 * noiseVal));
          col = mix(col, vec3(0.80, 0.36, 0.62), 0.12 * noiseVal);
          
          col *= noiseVal * 1.68;

          if (uKaleidoscope > 0.001) {
              vec3 colKaleido = vec3(0.95, 0.35, 0.85) * (0.8 + 0.5 * sin(iTime * 1.5 + noiseVal * 6.28));
              col = mix(col, col * 1.35 + colKaleido * 0.4, uKaleidoscope * 0.7);
          }

          // Linear Grid Vibe Shader Layer
          if (uGridVibe > 0.001) {
              vec2 gUV = (distortedUv - vec2(0.5)) * vec2(iResolution.x / iResolution.y, 1.0);
              vec2 gridLines = abs(fract(gUV * 18.0 - vec2(0.0, iTime * 0.5)) - 0.5);
              float lineIntensity = smoothstep(0.46, 0.5, max(gridLines.x, gridLines.y));
              float scanline = sin(gUV.y * 70.0 - iTime * 10.0) * 0.5 + 0.5;
              vec3 gridColor = vec3(1.0, 0.12, 0.70) * lineIntensity * 1.5 + vec3(0.1, 0.85, 1.0) * scanline * lineIntensity * 0.7;
              col = mix(col, col * 0.75 + gridColor, uGridVibe * 0.85);
          }

          // Subtiler, transparenter Lichtreflex der Wasserwelle
          if (uRippleActive > 0.5) {
            col += vec3(0.14, 0.08, 0.18) * waveNormal * waveFade;
          }

          col *= 0.70 + 0.65 * sqrt(70.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y));
          
          gl_FragColor = vec4(col, 1.0);
        }
      `;

      // Sumi-e 3D Ribbon Stroke Shaders
      const sumiVertexShader = `
        varying vec2 vUv;
        varying vec3 vPosition;
        uniform float uTime;

        void main() {
          vUv = uv;
          vPosition = position;

          float normX = clamp((position.x + 11.5) / 20.0, 0.0, 1.0);
          float mainSway = sin(uTime * 1.25) * 0.38;
          float subSway  = sin(uTime * 0.60) * 0.14;
          
          vec3 displacedPos = position;
          displacedPos.y += (mainSway + subSway) * normX;

          gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPos, 1.0);
        }
      `;

      const sumiFragmentShader = `
        varying vec2 vUv;
        varying vec3 vPosition;
        uniform vec3 uColor;
        uniform float uTotalLength;
        uniform float uProgress;

        vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
        float snoise(vec2 v){
          const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                   -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1;
          i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
          + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
            dot(x12.zw,x12.zw)), 0.0);
          m = m*m ;
          m = m*m ;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        void main() {
          float currentLength = uTotalLength * uProgress;
          if (vUv.y > currentLength) discard;

          float noiseVal = snoise(vec2(vUv.x * 30.0, vUv.y * 8.0));
          float wave = snoise(vec2(vUv.y * 2.0)) * 0.15;
          float distortedX = clamp(vUv.x + wave, 0.0, 1.0);
          float edgeBias = pow(distortedX, 2.0); 
          float threshold = mix(-1.5, 0.4, edgeBias); 
          
          float alpha = 0.95;
          float erosion = smoothstep(threshold, threshold + 0.6, noiseVal);
          alpha *= erosion;
          
          float distFromStart = vUv.y;
          float distFromEnd = currentLength - vUv.y;
          alpha *= smoothstep(0.0, 0.2, distFromStart);
          alpha *= smoothstep(0.0, 0.25, distFromEnd);

          vec3 sepiaWood = mix(vec3(1.0, 0.96, 0.90), vec3(0.78, 0.60, 0.44), erosion);
          vec3 finalColor = mix(sepiaWood, uColor, erosion);
          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      // Thin Shiny Blue Ring Shader for Petal Phase Orbs
      const ringFragmentShader = `
        varying vec2 vUv;
        uniform float uAlpha;
        uniform float uTime;

        void main() {
          vec2 p = vUv - vec2(0.5);
          float r = length(p);
          
          float uRadius = 0.38;
          float dist = abs(r - uRadius);
          
          float thinRing = smoothstep(0.018, 0.0, dist);
          float specularGlow = exp(-dist * dist * 900.0);
          float softHalo = exp(-dist * 35.0) * 0.25;
          
          float totalIntensity = (thinRing * 1.8 + specularGlow * 1.4 + softHalo) * smoothstep(0.50, 0.20, r);

          if (totalIntensity < 0.005) discard;

          float pulse = 0.85 + 0.15 * sin(uTime * 6.0);
          
          vec3 shinyCore = vec3(0.90, 0.97, 1.0);
          vec3 cyanElectric = vec3(0.0, 0.75, 1.0);
          vec3 finalCol = mix(cyanElectric, shinyCore, specularGlow * 0.85);

          gl_FragColor = vec4(finalCol, totalIntensity * uAlpha * pulse * 0.98);
        }
      `;

      // 2D Quad Mesh Shaders for Sumi-e Orb Nodes & Blue Aura Rings
      const orbMeshVertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;

      const orbFragmentShader = `
        varying vec2 vUv;
        uniform float uAlpha;
        uniform float uTime;
        uniform vec3 uColor;

        void main() {
          vec2 p = vUv - vec2(0.5);
          float r = length(p);
          if (r > 0.5) discard;

          float core = smoothstep(0.48, 0.0, r);
          float glow = pow(smoothstep(0.5, 0.0, r), 1.8);
          float pulse = 0.85 + 0.15 * sin(uTime * 4.5);
          vec3 col = mix(uColor, vec3(1.0, 1.0, 1.0), core * 0.85);
          
          gl_FragColor = vec4(col, (core * 0.95 + glow * 0.45) * uAlpha * pulse);
        }
      `;

      // Shader for Shining Star Particle Trails (4-Pointed Starburst Flares!)
      const particleTrailVertexShader = `
        attribute float size;
        attribute vec3 color;
        attribute float alpha;
        attribute float rotAngle;
        varying vec3 vColor;
        varying float vAlpha;
        varying float vRot;

        void main() {
          vColor = color;
          vAlpha = alpha;
          vRot = rotAngle;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (540.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `;

      const particleTrailFragmentShader = `
        varying vec3 vColor;
        varying float vAlpha;
        varying float vRot;

        void main() {
          vec2 p = gl_PointCoord - vec2(0.5);

          // Rotate UV coordinates for individual twinkling star orientation
          float c = cos(vRot);
          float s = sin(vRot);
          p = vec2(p.x * c - p.y * s, p.x * s + p.y * c);

          float d = length(p);
          if (d > 0.5) discard;

          // 4-pointed glowing starburst cross flare
          vec2 av = abs(p);
          float starPattern = max(0.0, 1.0 - (av.x * av.y) * 550.0);
          starPattern = pow(starPattern, 3.2);

          // Glowing central star nucleus
          float core = 1.0 / (1.0 + d * 12.0);
          core = pow(core, 2.2);

          vec3 finalColor = (vColor * 2.6 + vec3(1.0, 0.95, 1.0) * starPattern * 2.5) * (core + starPattern * 1.5);
          float finalAlpha = vAlpha * (core * 0.85 + starPattern * 0.95);

          gl_FragColor = vec4(finalColor, finalAlpha);
        }
      `;

      // Custom Shader for Glowing Plexus Star Nodes (4-Pointed Starburst Cross Flares)
      const plexusNodeVertexShader = `
        attribute float size;
        attribute vec3 color;
        attribute float rotAngle;
        varying vec3 vColor;
        varying float vRot;

        void main() {
          vColor = color;
          vRot = rotAngle;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (500.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `;

      const plexusNodeFragmentShader = `
        varying vec3 vColor;
        varying float vRot;

        void main() {
          vec2 p = gl_PointCoord - vec2(0.5);

          // Rotate star flare
          float c = cos(vRot);
          float s = sin(vRot);
          p = vec2(p.x * c - p.y * s, p.x * s + p.y * c);

          float d = length(p);
          if (d > 0.5) discard;

          // 4-Pointed Glowing Cross Star Flare
          vec2 av = abs(p);
          float starPattern = max(0.0, 1.0 - (av.x * av.y) * 620.0);
          starPattern = pow(starPattern, 3.2);

          // Hot central core
          float core = 1.0 / (1.0 + d * 14.0);
          core = pow(core, 2.2);

          vec3 finalColor = (vColor * 2.2 + vec3(1.0, 0.9, 1.0) * starPattern * 2.2) * (core + starPattern * 1.5);
          float alpha = core * 0.9 + starPattern * 0.95;

          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      function generatePetalTexture() {
        const c = document.createElement('canvas');
        c.width = 64; c.height = 64;
        const ctx = c.getContext('2d');
        ctx.filter = 'drop-shadow(0px 0px 8px rgba(255, 180, 235, 0.9))';
        const grad = ctx.createLinearGradient(0, 0, 64, 64);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, '#ffccf2');
        grad.addColorStop(0.7, '#ff66cc');
        grad.addColorStop(1, '#ff1a8c');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(32, 4);
        ctx.bezierCurveTo(50, 12, 60, 32, 50, 52);
        ctx.bezierCurveTo(40, 62, 24, 62, 14, 52);
        ctx.bezierCurveTo(4, 32, 14, 12, 32, 4);
        ctx.fill();
        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        return tex;
      }

      function getVisibleBounds() {
        if (!camera) return { maxX: 400, maxY: 220 };
        const aspect = window.innerWidth / window.innerHeight;
        const vHeight = 2.0 * Math.tan((camera.fov * Math.PI / 360)) * camera.position.z;
        const vWidth = vHeight * aspect;
        return {
          maxX: (vWidth * 0.42),
          maxY: (vHeight * 0.40)
        };
      }

      function rotateConcentric3D(vec, rotX, rotY, rotZ) {
        let x = vec.x, y = vec.y, z = vec.z;
        let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        let y1 = y * cosX - z * sinX;
        let z1 = y * sinX + z * cosX;
        let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        let x2 = x * cosY + z1 * sinY;
        let z2 = -x * sinY + z1 * cosY;
        let cosZ = Math.cos(rotZ), sinZ = Math.sin(rotZ);
        let x3 = x2 * cosZ - y1 * sinZ;
        let y3 = x2 * sinZ + y1 * cosZ;
        return { x: x3, y: y3, z: z2 };
      }

      // =========================================================================
      // SUMI-E BRANCH, BLOSSOM & PETAL VORTEX ENGINE
      // =========================================================================
      const SCREEN_BOUND_RIGHT = 8.5;
      const SCREEN_BOUND_LEFT = -9.0;
      const SCREEN_BOUND_TOP = 4.2;
      const SCREEN_BOUND_BOTTOM = -4.2;

      const MAX_BRANCHES_PER_ROUND = 5;
      const MAX_CLUSTERS_PER_ROUND = 8;
      const MAX_SUBBRANCH_EXTENSIONS = 2;

      let roundBranchCount = 0;
      let roundClusterCount = 0;

      let totalPetalOrbsCount = 0;
      let clickedPetalOrbsCount = 0;
      let isVortexActive = false;
      let vortexTimer = 0.0;
      const VORTEX_BUILD_TIME = 5.0;
      const VORTEX_HOLD_TIME = 5.0;
      const VORTEX_FADE_TIME = 5.0;
      const VORTEX_TOTAL_DURATION = VORTEX_BUILD_TIME + VORTEX_HOLD_TIME + VORTEX_FADE_TIME; // 15.0s
      let vortexBlendFactor = 0.0;

      let isRippleActive = false;
      let rippleTimer = 0.0;
      const RIPPLE_DURATION = 2.0;

      let isPaused = false;

      let strokeGroup, orbGroup, petalGroup;

      function calculateSwayDisplacement(x, z, t) {
        const normX = Math.max(0.0, Math.min(1.0, (x + 11.5) / 20.0));
        const mainSway = Math.sin(t * 1.25) * 0.38;
        const subSway = Math.sin(t * 0.60) * 0.14;
        return (mainSway + subSway) * normX;
      }

      class ImmersiveStroke {
        constructor(sceneGroup, baseWidth = 0.45, level = 0, colorHex = 0xf5e4cf) {
          this.maxPoints = 2000;
          this.pointCount = 0;
          this.points = [];
          this.pathLength = 0;
          this.baseWidth = baseWidth;
          this.currentWidth = baseWidth;
          this.level = level;
          this.seed = Math.random();
          this.lengthUniform = { value: 0 };
          this.progressUniform = { value: 0.0 };
          this.timeUniform = { value: 0.0 };

          this.positions = new Float32Array(this.maxPoints * 2 * 3);
          this.uvs = new Float32Array(this.maxPoints * 2 * 2);
          this.indices = new Uint16Array(this.maxPoints * 6);

          this.geometry = new THREE.BufferGeometry();
          this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
          this.geometry.setAttribute('uv', new THREE.BufferAttribute(this.uvs, 2));
          this.geometry.setIndex(new THREE.BufferAttribute(this.indices, 1));
          this.geometry.setDrawRange(0, 0);

          this.material = new THREE.ShaderMaterial({
            vertexShader: sumiVertexShader,
            fragmentShader: sumiFragmentShader,
            uniforms: {
              uColor: { value: new THREE.Color(colorHex) },
              uTotalLength: this.lengthUniform,
              uProgress: this.progressUniform,
              uTime: this.timeUniform
            },
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          this.mesh = new THREE.Mesh(this.geometry, this.material);
          sceneGroup.add(this.mesh);
        }

        addPoint(p, widthScale = 1.0) {
          if (this.pointCount >= this.maxPoints - 1) return;

          let dir = new THREE.Vector3(0, 1, 0);
          let dist = 0.5;

          if (this.pointCount > 0) {
            const lastP = this.points[this.pointCount - 1];
            dir.subVectors(p, lastP);
            dist = dir.length();
            if (dist < 0.02) return;
            dir.normalize();
          }

          const currentPoint = p.clone();
          this.points.push(currentPoint);
          this.pathLength += dist * 0.5;

          const up = new THREE.Vector3(0, 0, 1);
          let normal = new THREE.Vector3().crossVectors(dir, up).normalize();
          if (normal.lengthSq() < 0.001) {
            normal = new THREE.Vector3(1, 0, 0);
          }

          const normDist = Math.min(1.0, this.pathLength / 8.0);
          const pressureMod = 1.0 + 0.32 * Math.sin(normDist * Math.PI * 4.5 + this.seed * 7.0) + 0.12 * Math.cos(normDist * Math.PI * 9.0);
          const finalWidthScale = widthScale * Math.max(0.40, Math.min(1.40, pressureMod));

          const targetWidth = Math.max(0.035, this.baseWidth * finalWidthScale);
          this.currentWidth += (targetWidth - this.currentWidth) * 0.25;
          const width = this.currentWidth;

          const left = currentPoint.clone().add(normal.clone().multiplyScalar(width * 0.5));
          const right = currentPoint.clone().sub(normal.clone().multiplyScalar(width * 0.5));

          const i = this.pointCount * 6;
          this.positions[i] = left.x;
          this.positions[i + 1] = left.y;
          this.positions[i + 2] = left.z;

          this.positions[i + 3] = right.x;
          this.positions[i + 4] = right.y;
          this.positions[i + 5] = right.z;

          const u = this.pointCount * 4;
          this.uvs[u] = 0;
          this.uvs[u + 1] = this.pathLength;
          this.uvs[u + 2] = 1;
          this.uvs[u + 3] = this.pathLength;

          if (this.pointCount > 0) {
            const idx = (this.pointCount - 1) * 6;
            const vIdx = (this.pointCount - 1) * 2;
            this.indices[idx] = vIdx;
            this.indices[idx + 1] = vIdx + 1;
            this.indices[idx + 2] = vIdx + 2;
            this.indices[idx + 3] = vIdx + 1;
            this.indices[idx + 4] = vIdx + 3;
            this.indices[idx + 5] = vIdx + 2;
          }

          this.pointCount++;
          this.lengthUniform.value = this.pathLength;

          this.geometry.attributes.position.needsUpdate = true;
          this.geometry.attributes.uv.needsUpdate = true;
          this.geometry.index.needsUpdate = true;
          this.geometry.setDrawRange(0, Math.max(0, (this.pointCount - 1) * 6));
        }

        setProgress(progress) {
          this.progressUniform.value = progress;
        }

        setTime(t) {
          this.timeUniform.value = t;
        }
      }

      let trunkCurve;
      let mainTrunkStroke;
      const allBranches = [];
      let currentLeftEdgeX = -11.5;

      function initMainTrunk() {
        const startX = currentLeftEdgeX - 0.4;

        trunkCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(startX, -3.4, 0.0),
          new THREE.Vector3(startX + 2.5, -2.2, 0.25),
          new THREE.Vector3(-5.4, -2.7, -0.20),
          new THREE.Vector3(-3.4, -1.1, 0.30),
          new THREE.Vector3(-1.6, -0.4, -0.15),
          new THREE.Vector3(0.4, 0.8, 0.20),
          new THREE.Vector3(2.2, 0.1, -0.25),
          new THREE.Vector3(4.4, 0.7, 0.15),
          new THREE.Vector3(6.8, -0.4, 0.0)
        ], false, 'centripetal', 0.5);

        const trunkWidth = 0.58;
        mainTrunkStroke = new ImmersiveStroke(strokeGroup, trunkWidth, 0, 0xf5e4cf);
        const pts = trunkCurve.getSpacedPoints(140);
        for (let i = 0; i <= 140; i++) {
          const t = i / 140;
          const widthScale = Math.max(0.18, 1.0 - t * 0.55);
          mainTrunkStroke.addPoint(pts[i], widthScale);
        }
        allBranches.push({ curve: trunkCurve, stroke: mainTrunkStroke, level: 0, totalLength: trunkCurve.getLength() });
      }

      const activeOrbs = [];
      const spawnedBlossomClusterPositions = [];

      class OrbNode {
        constructor(parentBranchInfo, level, roundId, orbT, type = 'branch', customPos = null) {
          this.basePosition = customPos ? customPos.clone() : parentBranchInfo.curve.getPointAt(orbT).clone();
          this.position = this.basePosition.clone();
          this.parentBranchInfo = parentBranchInfo;
          this.level = level;
          this.roundId = roundId;
          this.type = type;
          this.alpha = 0.0;
          this.active = false;
          this.userDrawn = false;
          this.seed = Math.random();

          this.isExploding = false;
          this.explosionTimer = 0.0;
          this.explosionDuration = 0.40;

          const parentLen = parentBranchInfo ? parentBranchInfo.totalLength : 16.0;
          this.targetChildLength = parentLen * (0.45 + Math.random() * 0.12);

          const sideSign = (Math.random() > 0.5 ? 1 : -1);
          const angleDeg = sideSign * (20 + Math.random() * 20);
          this.angleRad = THREE.MathUtils.degToRad(angleDeg);
          this.guideDir = new THREE.Vector3(Math.cos(this.angleRad), Math.sin(this.angleRad), 0).normalize();

          const planeSize = (this.type === 'petal') ? 1.1 : 2.2;
          const geom = new THREE.PlaneGeometry(planeSize, planeSize);

          if (this.type === 'petal') {
            this.material = new THREE.ShaderMaterial({
              vertexShader: orbMeshVertexShader,
              fragmentShader: ringFragmentShader,
              uniforms: {
                uAlpha: { value: 0.0 },
                uTime: { value: 0.0 }
              },
              transparent: true,
              depthWrite: false
            });
          } else {
            const orbColor = this.type === 'branch' ? new THREE.Color(0xffb5dc) : new THREE.Color(0xff33cc);
            this.material = new THREE.ShaderMaterial({
              vertexShader: orbMeshVertexShader,
              fragmentShader: orbFragmentShader,
              uniforms: {
                uAlpha: { value: 0.0 },
                uTime: { value: 0.0 },
                uColor: { value: orbColor }
              },
              transparent: true,
              depthWrite: false
            });
          }

          this.mesh = new THREE.Mesh(geom, this.material);
          this.mesh.position.copy(this.position);
          this.mesh.position.z += 0.15;
          orbGroup.add(this.mesh);

          if (this.type === 'branch') {
            const hintVectorLength = 0.95;
            const lineMat = new THREE.LineDashedMaterial({
              color: 0xffffff,
              dashSize: 0.22,
              gapSize: 0.12,
              transparent: true,
              opacity: 0.0,
              depthWrite: false
            });

            const lineGeom = new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(0, 0, 0),
              new THREE.Vector3().copy(this.guideDir).multiplyScalar(hintVectorLength)
            ]);

            this.guideLine = new THREE.Line(lineGeom, lineMat);
            this.guideLine.computeLineDistances();
            this.mesh.add(this.guideLine);
          }
        }

        triggerExplosion() {
          this.isExploding = true;
          this.userDrawn = true;
          this.explosionTimer = 0.0;
        }

        setAlpha(a) {
          if (!this.isExploding) {
            this.alpha = a;
            this.material.uniforms.uAlpha.value = a;
          }
          if (this.guideLine) this.guideLine.material.opacity = a * 0.75;
        }

        update(time, delta = 0.016) {
          this.material.uniforms.uTime.value = time;
          const swayY = calculateSwayDisplacement(this.basePosition.x, this.basePosition.z, time);
          this.position.y = this.basePosition.y + swayY;
          this.mesh.position.copy(this.position);
          this.mesh.position.z += 0.15;

          if (this.isExploding) {
            this.explosionTimer += delta;
            const t = Math.min(1.0, this.explosionTimer / this.explosionDuration);
            const easeOut = 1.0 - Math.pow(1.0 - t, 3.0);

            const currentScale = 1.0 + easeOut * 2.2;
            this.mesh.scale.setScalar(currentScale);

            this.alpha = (1.0 - t) * 0.95;
            this.material.uniforms.uAlpha.value = this.alpha;

            if (t >= 1.0) {
              this.active = false;
              this.mesh.visible = false;
            }
          }
        }

        destroy() {
          orbGroup.remove(this.mesh);
        }
      }

      const growingSubBranches = [];
      const growingBlossomClusters = [];
      const persistentBlossomStrokes = [];
      const floating2DPetals = [];

      function create2DPetalGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);

        shape.bezierCurveTo(0.18, 0.08, 0.28, 0.25, 0.22, 0.45);
        shape.bezierCurveTo(0.18, 0.58, 0.08, 0.72, -0.08, 0.85);

        shape.bezierCurveTo(-0.14, 0.82, -0.12, 0.75, -0.10, 0.68);

        shape.bezierCurveTo(-0.14, 0.52, -0.06, 0.38, -0.10, 0.22);
        shape.bezierCurveTo(-0.12, 0.12, -0.06, 0.04, 0, 0);

        return new THREE.ShapeGeometry(shape);
      }

      const shared2DPetalGeometry = create2DPetalGeometry();

      class Floating2DPetal {
        constructor(originPos) {
          this.posX = originPos.x;
          this.posY = originPos.y;
          this.baseZ = -3.5 - Math.random() * 1.5;
          this.targetZ = 2.2 + Math.random() * 1.5;
          this.posZ = this.baseZ;

          this.seed = Math.random() * 100.0;
          this.indexNorm = Math.random();

          this.speedX = (Math.random() > 0.5 ? 1 : -1) * (0.6 + Math.random() * 0.8);
          this.speedY = (Math.random() - 0.5) * 0.4;

          this.amplitudeX = 1.6 + Math.random() * 2.2;
          this.amplitudeY = 1.2 + Math.random() * 1.8;
          this.amplitudeZ = 0.8 + Math.random() * 1.2;

          this.freqX = 0.3 + Math.random() * 0.4;
          this.freqY = 0.25 + Math.random() * 0.35;
          this.freqZ = 0.4 + Math.random() * 0.5;

          this.phaseX = Math.random() * Math.PI * 2.0;
          this.phaseY = Math.random() * Math.PI * 2.0;
          this.phaseZ = Math.random() * Math.PI * 2.0;

          this.age = 0.0;
          this.fadeInDuration = 0.8;

          const pinkColors = [0xff66cc, 0xff88dd, 0xff44aa, 0xffbbee, 0xff33aa];
          const color = pinkColors[Math.floor(Math.random() * pinkColors.length)];

          this.material = new THREE.MeshBasicMaterial({
            color: color,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.0,
            depthWrite: false
          });

          this.mesh = new THREE.Mesh(shared2DPetalGeometry, this.material);
          this.baseScale = 0.525 + Math.random() * 0.15;
          this.mesh.scale.setScalar(this.baseScale);

          this.mesh.position.set(this.posX, this.posY, this.posZ);
          petalGroup.add(this.mesh);
        }

        update(delta, totalElapsedTime) {
          this.age += delta;

          const fadeFactor = Math.min(1.0, this.age / this.fadeInDuration);
          this.material.opacity = fadeFactor * 0.92;

          if (!isVortexActive) {
            this.posX += this.speedX * delta;
            this.posY += this.speedY * delta;
          }

          const zMigrationSpeed = 0.45;
          if (this.posZ < this.targetZ) {
            this.posZ += zMigrationSpeed * delta;
          }

          if (this.posX > 15.5) this.posX = -15.5;
          if (this.posX < -15.5) this.posX = 15.5;
          if (this.posY < -8.5) this.posY = 8.5;
          if (this.posY > 8.5) this.posY = -8.5;

          const normalX = this.posX + Math.sin(this.age * this.freqX + this.phaseX) * this.amplitudeX;
          const normalY = this.posY + Math.cos(this.age * this.freqY + this.phaseY) * this.amplitudeY;
          const normalZ = this.posZ + Math.sin(this.age * this.freqZ + this.phaseZ) * this.amplitudeZ;

          const normH = this.indexNorm;
          const rawY = (normH - 0.5) * 18.0;

          const cylinderRadius = 14.0 + Math.sin(normH * Math.PI * 2.0 + this.seed) * 2.5;
          const spiralAngle = this.seed + totalElapsedTime * 1.8;

          const rawX = Math.cos(spiralAngle) * cylinderRadius;
          const rawZ = Math.sin(spiralAngle) * cylinderRadius;

          const sideTilt = 0.22;
          const tornadoX = rawX;
          const tornadoY = rawY * Math.cos(sideTilt) - rawZ * Math.sin(sideTilt);
          const tornadoZ = rawY * Math.sin(sideTilt) + rawZ * Math.cos(sideTilt);

          const smoothPower = vortexBlendFactor * vortexBlendFactor * (3.0 - 2.0 * vortexBlendFactor);

          const finalX = normalX * (1.0 - smoothPower) + tornadoX * smoothPower;
          const finalY = normalY * (1.0 - smoothPower) + tornadoY * smoothPower;
          const finalZ = normalZ * (1.0 - smoothPower) + tornadoZ * smoothPower;

          this.mesh.position.set(finalX, finalY, finalZ);

          const zScale = Math.max(0.30, Math.min(1.15, 0.45 + (finalZ + 3.5) * 0.14));
          this.mesh.scale.setScalar(this.baseScale * zScale);

          this.mesh.rotation.x = this.age * 0.4 + this.seed;
          this.mesh.rotation.y = this.age * 0.5 + this.seed;
          this.mesh.rotation.z = Math.sin(this.age * 0.6 + this.seed) * 0.8;
        }
      }

      function spawnPetalsFromOrb(orb) {
        if (isPaused) return;
        if (orb.userDrawn) return;

        orb.triggerExplosion();
        clickedPetalOrbsCount++;

        const numPetals = 4 + Math.floor(Math.random() * 4);
        for (let i = 0; i < numPetals; i++) {
          floating2DPetals.push(new Floating2DPetal(orb.position));
        }

        if (totalPetalOrbsCount > 0 && clickedPetalOrbsCount >= totalPetalOrbsCount) {
          isVortexActive = true;
          vortexTimer = 0.0;

          isRippleActive = true;
          rippleTimer = 0.0;
          if (bgUniforms.uRippleActive) bgUniforms.uRippleActive.value = 1.0;
          if (bgUniforms.uRippleTime) bgUniforms.uRippleTime.value = 0.0;
        }
      }

      function spawnBlossomClusterFromOrb(orb) {
        if (isPaused) return;
        if (currentPhase !== 'BLOSSOM') return;
        if (orb.userDrawn) return;
        if (roundClusterCount >= MAX_CLUSTERS_PER_ROUND) return;

        orb.userDrawn = true;
        orb.setAlpha(0.15);
        roundClusterCount++;

        const centerPos = orb.basePosition.clone();
        spawnedBlossomClusterPositions.push(orb.position.clone());

        const numLayerStrokes = 2 + Math.floor(Math.random() * 2);
        const brightPinkColors = [0xffccff, 0xffaae6, 0xff77dd, 0xffeeff, 0xff88ee];

        for (let s = 0; s < numLayerStrokes; s++) {
          const strokeColor = brightPinkColors[Math.floor(Math.random() * brightPinkColors.length)];
          const clusterRadius = 0.16 + Math.random() * 0.12;

          const baseAngle = Math.random() * Math.PI * 2.0;
          const pts = [];
          const numPts = 20;

          for (let i = 0; i <= numPts; i++) {
            const t = i / numPts;
            const angle = baseAngle + t * Math.PI * (1.2 + Math.random() * 0.5);
            const r = clusterRadius * (0.6 + 0.4 * Math.sin(t * Math.PI * 2.0 + s));

            const pt = centerPos.clone().add(new THREE.Vector3(
              Math.cos(angle) * r,
              Math.sin(angle) * r,
              (Math.random() - 0.5) * 0.12
            ));

            pts.push(pt);
          }

          const clusterCurve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
          const strokeWidth = 0.30 + Math.random() * 0.12;
          const clusterStroke = new ImmersiveStroke(strokeGroup, strokeWidth, 3, strokeColor);

          const spacedPts = clusterCurve.getSpacedPoints(35);
          for (let i = 0; i <= 35; i++) {
            const t = i / 35;
            const widthScale = 0.6 + 0.8 * Math.sin(t * Math.PI);
            clusterStroke.addPoint(spacedPts[i], widthScale);
          }

          growingBlossomClusters.push({
            stroke: clusterStroke,
            progress: 0.0,
            duration: 0.5
          });

          persistentBlossomStrokes.push(clusterStroke);
        }
      }

      function spawnSubBranchFromOrb(orb) {
        if (isPaused) return;
        if (currentPhase !== 'BRANCH') return;
        if (orb.userDrawn) return;
        if (roundBranchCount >= MAX_BRANCHES_PER_ROUND) return;

        const nextLevel = orb.level + 1;
        if (nextLevel > MAX_SUBBRANCH_EXTENSIONS) return;

        orb.userDrawn = true;
        orb.setAlpha(0.15);
        roundBranchCount++;

        const baseWidth = nextLevel === 1 ? 0.32 : 0.18;

        const numPts = 45;
        const startPos = orb.basePosition.clone();
        const pts = [startPos.clone()];
        const totalLen = orb.targetChildLength;

        let effectiveGuideDir = orb.guideDir.clone();
        const projectedEnd = startPos.clone().addScaledVector(effectiveGuideDir, totalLen);

        if (projectedEnd.x > SCREEN_BOUND_RIGHT) {
          effectiveGuideDir.x -= 0.55;
        } else if (projectedEnd.x < SCREEN_BOUND_LEFT) {
          effectiveGuideDir.x += 0.55;
        }
        if (projectedEnd.y > SCREEN_BOUND_TOP) {
          effectiveGuideDir.y -= 0.45;
        } else if (projectedEnd.y < SCREEN_BOUND_BOTTOM) {
          effectiveGuideDir.y += 0.45;
        }
        effectiveGuideDir.normalize();

        const normal = new THREE.Vector3(-effectiveGuideDir.y, effectiveGuideDir.x, 0).normalize();

        for (let i = 1; i <= numPts; i++) {
          const t = i / numPts;
          const currentDist = totalLen * t;

          const wave1 = Math.sin(t * Math.PI * 4.0 + orb.seed * 6.0) * 0.48;
          const wave2 = Math.cos(t * Math.PI * 8.0 + orb.seed * 3.0) * 0.22;
          const sideOffset = (wave1 + wave2) * (1.0 - t * 0.35);

          const p = startPos.clone()
            .addScaledVector(effectiveGuideDir, currentDist)
            .addScaledVector(normal, sideOffset);

          p.z += (Math.sin(t * Math.PI * 2.0 + orb.seed) - 0.5) * 0.3;
          pts.push(p);
        }

        const childCurve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
        const childStroke = new ImmersiveStroke(strokeGroup, baseWidth, nextLevel, 0xf5e4cf);

        const spacedPts = childCurve.getSpacedPoints(70);
        for (let i = 0; i <= 70; i++) {
          const t = i / 70;
          const widthScale = Math.max(0.15, 1.0 - t * 0.60);
          childStroke.addPoint(spacedPts[i], widthScale);
        }

        growingSubBranches.push({
          stroke: childStroke,
          progress: 0.0,
          duration: 3.0
        });

        allBranches.push({
          curve: childCurve,
          stroke: childStroke,
          level: nextLevel,
          totalLength: totalLen
        });
      }

      let currentPhase = 'BRANCH';
      let currentRound = 0;
      const maxRoundsPerPhase = 5;
      let roundTimer = 0.0;
      let roundState = 'IDLE';

      const ROUND_ACTIVE_TIME_DEFAULT = 5.0;
      const ROUND_ACTIVE_TIME_PETAL = 30.0;
      const ROUND_FADE_TIME = 0.5;
      const ROUND_PAUSE_TIME = 2.0;

      function spawnOrbRound(roundNumber, phase = 'BRANCH') {
        currentRound = roundNumber;
        currentPhase = phase;
        roundTimer = 0.0;
        roundState = 'ACTIVE';

        roundBranchCount = 0;
        roundClusterCount = 0;

        activeOrbs.forEach(orb => orb.destroy());
        activeOrbs.length = 0;

        if (phase === 'PETAL') {
          totalPetalOrbsCount = 0;
          clickedPetalOrbsCount = 0;
          isVortexActive = false;
          vortexBlendFactor = 0.0;
          isRippleActive = false;
          rippleTimer = 0.0;
          if (bgUniforms.uRippleActive) bgUniforms.uRippleActive.value = 0.0;

          if (spawnedBlossomClusterPositions.length === 0) {
            allBranches.forEach(bInfo => {
              spawnedBlossomClusterPositions.push(bInfo.curve.getPointAt(0.3 + Math.random() * 0.5));
            });
          }

          totalPetalOrbsCount = spawnedBlossomClusterPositions.length;

          spawnedBlossomClusterPositions.forEach((pos, idx) => {
            const orb = new OrbNode(null, 3, roundNumber, 0.5, 'petal', pos);
            orb.active = true;
            activeOrbs.push(orb);
          });
        } else if (phase === 'BRANCH') {
          const validBranches = allBranches.filter(b => b.level < MAX_SUBBRANCH_EXTENSIONS);
          if (validBranches.length === 0 && roundNumber > 1) {
            spawnOrbRound(1, 'BLOSSOM');
            return;
          }
          validBranches.forEach(bInfo => {
            const numOrbs = (bInfo.level === 0) ? 2 : 1;
            for (let i = 0; i < numOrbs; i++) {
              const t = 0.15 + Math.random() * 0.70;
              const orb = new OrbNode(bInfo, bInfo.level, roundNumber, t, 'branch');
              orb.active = true;
              activeOrbs.push(orb);
            }
          });
        } else if (phase === 'BLOSSOM') {
          const numTotalBlossoms = Math.min(8, allBranches.length * 2);
          for (let i = 0; i < numTotalBlossoms; i++) {
            const bInfo = allBranches[i % allBranches.length];
            const t = 0.20 + Math.random() * 0.70;
            const orb = new OrbNode(bInfo, bInfo.level, roundNumber, t, 'blossom');
            orb.active = true;
            activeOrbs.push(orb);
          }
        }

        updateInstructionUI();
      }

        if (bgUniforms.uRippleActive) bgUniforms.uRippleActive.value = 0.0;
        if (bgUniforms.uRippleTime) bgUniforms.uRippleTime.value = 0.0;

        if (strokeGroup) {
          for (let i = strokeGroup.children.length - 1; i >= 0; i--) {
            const child = strokeGroup.children[i];
            strokeGroup.remove(child);
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          }
        }

        if (petalGroup) {
          for (let i = petalGroup.children.length - 1; i >= 0; i--) {
            const child = petalGroup.children[i];
            petalGroup.remove(child);
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          }
        }

        allBranches.length = 0;
        initMainTrunk();

        activeOrbs.forEach(orb => orb.destroy());
        activeOrbs.length = 0;
        spawnedBlossomClusterPositions.length = 0;
        growingSubBranches.length = 0;
        growingBlossomClusters.length = 0;
        persistentBlossomStrokes.length = 0;
        floating2DPetals.length = 0;

        updateTrunkGrowth(0.001);
      }

      let growthProgress = 0.0;
      const growthDuration = 10.0;
      let trunkCompleted = false;
      let trunkPostDelayTimer = 0.0;

      function updateInstructionUI() {
        if (!phaseText || !instructionText) return;

        const pauseSuffix = isPaused ? " (Pausiert)" : "";

        if (activeMode === 'bluten') {
          if (growthProgress < 1.0) {
            const percent = Math.floor(growthProgress * 100);
            phaseText.innerText = "Sumi-e Stammwuchs" + pauseSuffix;
            instructionText.innerText = `Der Stamm wächst heran (${percent}%)... Lehne dich zurück und beobachte den Wuchs.`;
          } else if (currentPhase === 'BRANCH') {
            phaseText.innerText = `Ast-Phase — Runde ${currentRound}/${maxRoundsPerPhase}` + pauseSuffix;
            instructionText.innerText = "Halte an einem Knotenpunkt die Maus gedrückt und ziehe entlang der Hilfslinie, um einen weiteren Ast wachsen zu lassen.";
          } else if (currentPhase === 'BLOSSOM') {
            phaseText.innerText = `Blüten-Phase — Runde ${currentRound}/${maxRoundsPerPhase}` + pauseSuffix;
            instructionText.innerText = "Drücke auf einen Knotenpunkt, um Sakurablüten zu erzeugen";
          } else if (currentPhase === 'PETAL') {
            if (isVortexActive) {
              phaseText.innerText = "Sakura Vortex Sturm" + pauseSuffix;
              instructionText.innerText = "Alle Blüten wurden ausgewählt! Der Sakura-Vortex wurde freigesetzt";
            } else if (roundState === 'IDLE' || roundTimer >= ROUND_ACTIVE_TIME_PETAL) {
              phaseText.innerText = "Sakura Kunstwerk Vollständig" + pauseSuffix;
              instructionText.innerText = "Das Blütenkunstwerk ist vollendet! Klicke oben rechts auf 'Restart', wenn du von vorn beginnen möchtest.";
            } else {

        } else if (activeMode === 'plexus') {
          phaseText.innerText = "Plexus Konstellation" + pauseSuffix;
          instructionText.innerText = "Bewege deine Maus/Touch, um leuchtende Partikel-Knoten und Energielinien im Raum zu verbinden. Halte gedrückt für Impuls-Sphären.";

        }
      }

        if (!mainTrunkStroke) return;

        updateInstructionUI();

      function copyToClipboard(text) {
        return new Promise((resolve, reject) => {
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(resolve).catch(() => {
              fallbackCopy(text) ? resolve() : reject();
            });
          } else {
            fallbackCopy(text) ? resolve() : reject();
          }
        });
      }

      function fallbackCopy(text) {
        try {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          textArea.style.top = '-9999px';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(textArea);
          return successful;
        } catch (err) {
          return false;
        }
      }

      function broadcastState(type, payload = {}) {
        const packet = { type, role: myRole, senderIndex: activeUserIndex, ...payload };

        // 1. Local BroadcastChannel (Same machine / multi-tab fallback)
        if (broadcastChannel) {
          try { broadcastChannel.postMessage(packet); } catch (e) { }
        }

        // 2. PeerJS WebRTC DataChannel (Cross-device / cross-network real time)
        if (activePeerConn && activePeerConn.open) {
          try { activePeerConn.send(packet); } catch (e) { }
        }
      }

      function initPeerConnection() {
        if (typeof Peer === 'undefined') return;

        // Clean room ID for PeerJS
        const cleanRoomId = `artcube-${roomId.replace(/[^a-zA-Z0-9_-]/g, '')}`;

        if (myRole === 'host') {
          try {
            peer = new Peer(cleanRoomId);
            peer.on('open', (id) => {
              console.log('Host PeerJS initialized with ID:', id);
            });
            peer.on('connection', (conn) => {
              activePeerConn = conn;
              setupPeerConnectionListeners(conn);
              showToast("WebRTC Mitspieler verbunden!");
            });
            peer.on('error', (err) => {
              console.warn('PeerJS Host Error:', err);
            });
          } catch (e) {
            console.warn('PeerJS init failed:', e);
          }
        } else {
          try {
            peer = new Peer();
            peer.on('open', () => {
              const conn = peer.connect(cleanRoomId);
              activePeerConn = conn;
              setupPeerConnectionListeners(conn);
            });
            peer.on('error', (err) => {
              console.warn('PeerJS Guest Error:', err);
            });
          } catch (e) {
            console.warn('PeerJS init failed:', e);
          }
        }
      }

      function setupPeerConnectionListeners(conn) {
        conn.on('open', () => {
          isGuestJoined = true;
          updateParticipantStatus();
          broadcastState('HELLO', { user1Name, user2Name, role: myRole });
        });

        conn.on('data', (data) => {
          handleIncomingNetworkData(data);
        });

        conn.on('close', () => {
          activePeerConn = null;
        });
      }

      function setupBroadcastListener() {
        if (broadcastChannel) {
          broadcastChannel.onmessage = (event) => {
            handleIncomingNetworkData(event.data);
          };
        }

        initPeerConnection();
        broadcastState('HELLO', { user1Name, user2Name, role: myRole });
      }

      function handleIncomingNetworkData(data) {
        if (!data || !data.type) return;

        // Safely update names depending on who sent the packet
        if (myRole === 'host') {
          // Host only accepts user2Name from guest
          if (data.user2Name && (data.role === 'guest' || data.type === 'GUEST_JOINED')) {
            user2Name = data.user2Name;
          }
        } else {
          // Guest accepts user1Name from host
          if (data.user1Name && data.role === 'host') {
            user1Name = data.user1Name;
          }
          if (data.user2Name && data.role === 'host') {
            user2Name = data.user2Name;
          }
        }

        if (data.type === 'HELLO' || data.type === 'GUEST_JOINED') {
          isGuestJoined = true;
          updateParticipantStatus();
          if (data.type === 'GUEST_JOINED') {
            showToast(`Mitspieler ${user2Name} ist beigetreten!`);
          }
          if (myRole === 'host') {
            broadcastState('WELCOME', { user1Name, user2Name });
          }
        } else if (data.type === 'WELCOME') {
          isGuestJoined = true;
          updateParticipantStatus();
        } else if (data.type === 'CURSOR_MOVE') {
          if (!isGuestJoined) {
            isGuestJoined = true;
            updateParticipantStatus();
          }
          const remoteIdx = data.senderIndex || (data.role === 'host' ? 1 : 2);
          const cursorElem = document.getElementById(remoteIdx === 1 ? 'userCursor1' : 'userCursor2');
          if (cursorElem) {
            const cX = data.normX * window.innerWidth;
            const cY = (1.0 - data.normY) * window.innerHeight;
            cursorElem.style.left = `${cX}px`;
            cursorElem.style.top = `${cY}px`;
            if (isArtworkStarted) {
              cursorElem.classList.add('active');
            }

            if (camera) {
              const vector = new THREE.Vector3(data.normX * 2 - 1, data.normY * 2 - 1, 0.5);
              vector.unproject(camera);
              const dir = vector.sub(camera.position).normalize();
              const dist = -camera.position.z / dir.z;
              if (remoteIdx === 1) {
                mouseWorld.copy(camera.position).add(dir.multiplyScalar(dist));
              } else {
                user2WorldPos.copy(camera.position).add(dir.multiplyScalar(dist));
              }
            }
          }
        } else if (data.type === 'GESTURE') {
          const remoteIdx = data.senderIndex || (data.role === 'host' ? 1 : 2);
          triggerCursorGesture(remoteIdx, data.gestureType);
        } else if (data.type === 'CANVAS_CLICK') {
          handleRemoteCanvasClick(data);
        } else if (data.type === 'PLEXUS_CREATE') {
          handleRemotePlexusCreate(data);
        } else if (data.type === 'SPAWN_GRID_TREE') {
          if (data.x !== undefined) {
            spawnGridTreeAt(new THREE.Vector3(data.x, data.y, data.z));
          }
        } else if (data.type === 'PLEXUS_DRAG') {
          handleRemotePlexusDrag(data);
        } else if (data.type === 'USER_NAME') {
          updateParticipantStatus();
        } else if (data.type === 'START_ARTWORK') {
          if (!isArtworkStarted) {
            launchArtworkExperience(false);
          }
        } else if (data.type === 'MODE_SWITCH') {
          if (data.mode && data.mode !== activeMode) {
            switchMode(data.mode, false);
          }
        } else if (data.type === 'PAUSE_TOGGLE') {
          if (typeof data.isPaused !== 'undefined') {
            isPaused = data.isPaused;
            if (pauseIcon) pauseIcon.textContent = isPaused ? "▶️" : "⏸️";
            if (pauseLabel) pauseLabel.textContent = isPaused ? "Play" : "Pause";
            if (isPaused) {
              if (bgAudio && !bgAudio.paused) bgAudio.pause();
            } else {
              if (!isAudioMuted) playAudioTrack();
            }
            showToast(isPaused ? "Partner hat die Session pausiert" : "Partner hat die Session fortgesetzt");
          }
        } else if (data.type === 'RESTART_ARTWORK') {
          restartAll();
          showToast("Partner hat das Kunstwerk zurückgesetzt!");
        }
      }

      function triggerCursorGesture(userIndex, type) {
        const circle = document.getElementById(userIndex === 1 ? 'cursorCircle1' : 'cursorCircle2');
        const cursor = document.getElementById(userIndex === 1 ? 'userCursor1' : 'userCursor2');
        if (!circle || !cursor) return;

        if (type === 'mousedown' || type === 'hold') {
          circle.classList.add('gesture-active');
        } else if (type === 'mouseup') {
          circle.classList.remove('gesture-active');
        } else if (type === 'click' || type === 'orb_click' || type === 'burst') {
          circle.classList.add('gesture-click');
          setTimeout(() => circle.classList.remove('gesture-click'), 400);

          const ring = document.createElement('div');
          ring.className = 'gesture-ring';
          ring.style.setProperty('--user-color-glow', userIndex === 1 ? `rgba(${user1Color.rgb}, 0.9)` : `rgba(${user2Color.rgb}, 0.9)`);
          cursor.appendChild(ring);
          setTimeout(() => ring.remove(), 600);
        }
      }

      function requestLandscapeOrientation() {
        // Vollbildmodus in der Desktopansicht deaktiviert (nur auf Touch-/Mobilgeräten aktivieren)
        const isMobileTouch = ('ontouchstart' in window) || (typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0) || (window.innerWidth <= 950);
        if (!isMobileTouch) return;

        try {
          if (document.documentElement && document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => { });
          } else if (document.documentElement && document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
          }
          if (typeof screen !== 'undefined' && screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => { });
          }
        } catch (e) { }
      }

      function updateCameraDistance() {
        if (!camera) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        const aspect = w / h;

        if (activeMode === 'bluten' || activeMode === 'wald') {
          camera.fov = 45;
          camera.updateProjectionMatrix();
          const visibleWidth = 2 * Math.tan(THREE.MathUtils.degToRad(22.5)) * 16 * aspect;
          const targetCamX = -9.6 + (visibleWidth * 0.48);
          camera.position.set(targetCamX, -0.4, 16);
          camera.lookAt(targetCamX, -0.4, 0);
          currentLeftEdgeX = targetCamX - (visibleWidth / 2.0);
        } else {
          camera.fov = 60;
          camera.updateProjectionMatrix();

          // Target Laptop Aspect Ratio (16:9 = ~1.777)
          const laptopAspect = 16 / 9;
          const widthScale = Math.max(0.35, Math.min(1.0, w / 1440));
          let baseDist = (aspect < 1.0 ? 680 : 540) / widthScale;

          if (w <= 950 && aspect > laptopAspect) {
            baseDist *= (aspect / laptopAspect);
          }

          camera.position.set(0, 0, baseDist);
          camera.lookAt(0, 0, 0);
        }
      }
