      // ==========================================
      // AMBIENT SPARKLE PARTICLES & DRIFTING GRID TREE SYSTEM
      // ==========================================
      const NUM_AMBIENT_SPARKLES = 600;
      let ambientSparkleMesh = null;
      let gridTreeGroup = null;

      const ambientBasePositions = new Float32Array(NUM_AMBIENT_SPARKLES * 3);
      const ambientCurrentPositions = new Float32Array(NUM_AMBIENT_SPARKLES * 3);
      const ambientVelocities = new Float32Array(NUM_AMBIENT_SPARKLES * 3);
      const ambientDefaultColors = new Float32Array(NUM_AMBIENT_SPARKLES * 3);
      const ambientCurrentColors = new Float32Array(NUM_AMBIENT_SPARKLES * 3);
      const ambientSizes = new Float32Array(NUM_AMBIENT_SPARKLES);

      function setupAmbientSparkles() {
        const geo = new THREE.BufferGeometry();
        for (let i = 0; i < NUM_AMBIENT_SPARKLES; i++) {
          const bx = (Math.random() - 0.5) * 40;
          const by = (Math.random() - 0.5) * 25;
          const bz = (Math.random() - 0.5) * 20;

          ambientBasePositions[i * 3] = bx;
          ambientBasePositions[i * 3 + 1] = by;
          ambientBasePositions[i * 3 + 2] = bz;

          ambientCurrentPositions[i * 3] = bx;
          ambientCurrentPositions[i * 3 + 1] = by;
          ambientCurrentPositions[i * 3 + 2] = bz;

          ambientVelocities[i * 3] = (Math.random() - 0.5) * 0.3;
          ambientVelocities[i * 3 + 1] = (Math.random() - 0.5) * 0.3 + 0.1;
          ambientVelocities[i * 3 + 2] = (Math.random() - 0.5) * 0.2;

          // Sparkling Pink / Magenta default colors
          const cr = 1.0;
          const cg = 0.35 + Math.random() * 0.4;
          const cb = 0.75 + Math.random() * 0.25;

          ambientDefaultColors[i * 3] = cr;
          ambientDefaultColors[i * 3 + 1] = cg;
          ambientDefaultColors[i * 3 + 2] = cb;

          ambientCurrentColors[i * 3] = cr;
          ambientCurrentColors[i * 3 + 1] = cg;
          ambientCurrentColors[i * 3 + 2] = cb;

          ambientSizes[i] = 1.2 + Math.random() * 2.5;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(ambientCurrentPositions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(ambientCurrentColors, 3));
        geo.setAttribute('size', new THREE.BufferAttribute(ambientSizes, 1));

        const mat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 } },
          vertexShader: `
            attribute float size;
            attribute vec3 color;
            varying vec3 vColor;
            uniform float uTime;
            void main() {
              vColor = color;
              vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
              float pulse = 0.5 + 0.5 * sin(uTime * 3.0 + position.x * 0.1);
              gl_PointSize = size * (220.0 / -mvPosition.z) * pulse;
              gl_Position = projectionMatrix * mvPosition;
            }
          `,
          fragmentShader: `
            varying vec3 vColor;
            void main() {
              vec2 coord = gl_PointCoord - vec2(0.5);
              float dist = length(coord);
              if (dist > 0.5) discard;
              float intensity = pow(1.0 - (dist / 0.5), 2.0);
              gl_FragColor = vec4(vColor, intensity * 0.95);
            }
          `,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        ambientSparkleMesh = new THREE.Points(geo, mat);
        ambientSparkleMesh.visible = (activeMode === 'wald');
        mainScene.add(ambientSparkleMesh);
      }

      function updateAmbientSparkles(delta, time) {
        if (!ambientSparkleMesh || activeMode !== 'wald') return;
        const positions = ambientSparkleMesh.geometry.attributes.position.array;
        const colors = ambientSparkleMesh.geometry.attributes.color.array;
        const targetPos = (activeUserIndex === 1) ? mouseWorld : user2WorldPos;

        for (let i = 0; i < NUM_AMBIENT_SPARKLES; i++) {
          // Base Ambient Drift Movement
          ambientBasePositions[i * 3] += ambientVelocities[i * 3] * delta;
          ambientBasePositions[i * 3 + 1] += ambientVelocities[i * 3 + 1] * delta;
          ambientBasePositions[i * 3 + 2] += ambientVelocities[i * 3 + 2] * delta;

          if (ambientBasePositions[i * 3] > 25) ambientBasePositions[i * 3] = -25;
          if (ambientBasePositions[i * 3] < -25) ambientBasePositions[i * 3] = 25;
          if (ambientBasePositions[i * 3 + 1] > 15) ambientBasePositions[i * 3 + 1] = -15;
          if (ambientBasePositions[i * 3 + 1] < -15) ambientBasePositions[i * 3 + 1] = 15;

          let px = positions[i * 3];
          let py = positions[i * 3 + 1];
          let pz = positions[i * 3 + 2];

          const bx = ambientBasePositions[i * 3];
          const by = ambientBasePositions[i * 3 + 1];
          const bz = ambientBasePositions[i * 3 + 2];

          let targetX = bx;
          let targetY = by;
          let targetZ = bz;

          let targetR = ambientDefaultColors[i * 3];
          let targetG = ambientDefaultColors[i * 3 + 1];
          let targetB = ambientDefaultColors[i * 3 + 2];

          if (targetPos) {
            const dx = targetPos.x - px;
            const dy = targetPos.y - py;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (isMouseDown) {
              // 1. Mouse HOLDing: Particles assemble into an 80% SMALLER 3D concentric sphere around cursor (within 100px / ~2.5 3D units)!
              if (dist < 2.5) {
                const phi = (i * 137.5 * Math.PI / 180.0) % (Math.PI * 2);
                const theta = Math.acos(1.0 - 2.0 * ((i % 100) / 100.0));
                const shellRadius = 0.48 + (i % 3) * 0.16; // 80% smaller concentric spherical shell!

                const sphereOffsetX = Math.sin(theta) * Math.cos(phi + time * 2.5) * shellRadius;
                const sphereOffsetY = Math.sin(theta) * Math.sin(phi + time * 2.5) * shellRadius;
                const sphereOffsetZ = Math.cos(theta) * shellRadius;

                targetX = targetPos.x + sphereOffsetX;
                targetY = targetPos.y + sphereOffsetY;
                targetZ = targetPos.z + sphereOffsetZ;

                // Dynamic shifting rainbow colors while holding
                const hue = (time * 5.0 + i * 0.15) % (Math.PI * 2);
                targetR = (0.5 + 0.5 * Math.sin(hue)) * 1.3;
                targetG = (0.5 + 0.5 * Math.sin(hue + 2.094)) * 1.3;
                targetB = (0.5 + 0.5 * Math.sin(hue + 4.188)) * 1.3;
              }
            } else {
              // 2. Normal Hover (not holding): Dezent WEGBEWEGEN (Repulsion) when cursor is near. Return when cursor leaves!
              if (dist < 5.5) {
                const repelForce = Math.max(0, (5.5 - dist) / 5.5) * 4.0;
                targetX = bx - (dx / Math.max(0.1, dist)) * repelForce;
                targetY = by - (dy / Math.max(0.1, dist)) * repelForce;
              }
            }
          }

          // Smooth position & color interpolation (Return smoothly when cursor leaves)
          px += (targetX - px) * 0.08;
          py += (targetY - py) * 0.08;
          pz += (targetZ - pz) * 0.08;

          colors[i * 3] += (targetR - colors[i * 3]) * 0.08;
          colors[i * 3 + 1] += (targetG - colors[i * 3 + 1]) * 0.08;
          colors[i * 3 + 2] += (targetB - colors[i * 3 + 2]) * 0.08;

          positions[i * 3] = px;
          positions[i * 3 + 1] = py;
          positions[i * 3 + 2] = pz;
        }

        ambientSparkleMesh.geometry.attributes.position.needsUpdate = true;
        ambientSparkleMesh.geometry.attributes.color.needsUpdate = true;
        ambientSparkleMesh.material.uniforms.uTime.value = time;
      }

      // 3D Drifting Shibuya Sakura Stage Grid-Tree (Gitterbaum) Class — Slim & Subtle
      let activeGridTrees = [];

      class GridTree {
        constructor(originPos) {
          this.group = new THREE.Group();
          this.origin = originPos.clone();
          this.group.position.copy(this.origin);

          // Random 3D drift velocity across screen
          this.driftX = (Math.random() - 0.5) * 2.2;
          this.driftY = (Math.random() - 0.5) * 1.5;
          this.driftZ = (Math.random() - 0.5) * 1.0;

          this.growthProgress = 0.0;
          this.duration = 1.8;

          const linePositions = [];
          const lineColors = [];
          const nodePositions = [];
          const nodeColors = [];

          // 1. Shibuya Sakura Stage Slender Central Metallic Column (Trunk)
          const trunkHeight = 5.5 + Math.random() * 1.5;
          const trunkRadius = 0.15; // Slim & subtle pillar
          const pillarCorners = [
            [Math.cos(0), Math.sin(0)],
            [Math.cos(Math.PI / 2), Math.sin(Math.PI / 2)],
            [Math.cos(Math.PI), Math.sin(Math.PI)],
            [Math.cos(3 * Math.PI / 2), Math.sin(3 * Math.PI / 2)],
          ];

          const segs = 6;
          for (let s = 0; s < segs; s++) {
            const y0 = (s / segs) * trunkHeight;
            const y1 = ((s + 1) / segs) * trunkHeight;

            for (let c = 0; c < 4; c++) {
              const nextC = (c + 1) % 4;

              linePositions.push(
                pillarCorners[c][0] * trunkRadius, y0, pillarCorners[c][1] * trunkRadius,
                pillarCorners[c][0] * trunkRadius, y1, pillarCorners[c][1] * trunkRadius
              );

              linePositions.push(
                pillarCorners[c][0] * trunkRadius, y0, pillarCorners[c][1] * trunkRadius,
                pillarCorners[nextC][0] * trunkRadius, y0, pillarCorners[nextC][1] * trunkRadius
              );

              nodePositions.push(pillarCorners[c][0] * trunkRadius, y0, pillarCorners[c][1] * trunkRadius);
              nodeColors.push(0.95, 0.95, 1.0);
            }
          }

          // 2. Shibuya Sakura Stage Architectural 3D Cubic Grid Matrix Canopy (At Top) — Subtle & Slim
          const canopyY = trunkHeight;
          const gridSizeX = 4;
          const gridSizeZ = 4;
          const gridLevels = 3;
          const stepSize = 0.75; // Slim, subtle grid spacing

          const halfX = ((gridSizeX - 1) * stepSize) / 2.0;
          const halfZ = ((gridSizeZ - 1) * stepSize) / 2.0;

          for (let gx = 0; gx < gridSizeX; gx++) {
            for (let gy = 0; gy < gridLevels; gy++) {
              for (let gz = 0; gz < gridSizeZ; gz++) {
                const px = gx * stepSize - halfX;
                const py = canopyY + gy * stepSize;
                const pz = gz * stepSize - halfZ;

                // Subtle Glowing Light Bulb Node at grid intersections
                nodePositions.push(px, py, pz);
                nodeColors.push(1.0, 0.5, 0.88);

                // Connect X beam
                if (gx < gridSizeX - 1) {
                  linePositions.push(px, py, pz, px + stepSize, py, pz);
                }
                // Connect Y vertical strut
                if (gy < gridLevels - 1) {
                  linePositions.push(px, py, pz, px, py + stepSize, pz);
                }
                // Connect Z beam
                if (gz < gridSizeZ - 1) {
                  linePositions.push(px, py, pz, px, py, pz + stepSize);
                }
              }
            }
          }

          for (let i = 0; i < linePositions.length / 3; i++) {
            const ratio = i / (linePositions.length / 3);
            lineColors.push(
              0.5 + 0.5 * Math.sin(ratio * Math.PI),
              0.6 + 0.4 * Math.cos(ratio * Math.PI),
              0.98
            );
          }
          for (let i = 0; i < nodePositions.length / 3; i++) {
            nodeColors.push(1.0, 0.3, 0.85);
          }

          const lineGeo = new THREE.BufferGeometry();
          lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
          lineGeo.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

          const lineMat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          this.linesMesh = new THREE.LineSegments(lineGeo, lineMat);
          this.group.add(this.linesMesh);

          const nodeGeo = new THREE.BufferGeometry();
          nodeGeo.setAttribute('position', new THREE.Float32BufferAttribute(nodePositions, 3));
          nodeGeo.setAttribute('color', new THREE.Float32BufferAttribute(nodeColors, 3));

          const nodeMat = new THREE.PointsMaterial({
            size: 0.25,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          this.nodesMesh = new THREE.Points(nodeGeo, nodeMat);
          this.group.add(this.nodesMesh);

          this.group.scale.set(0.01, 0.01, 0.01);
          if (gridTreeGroup) {
            gridTreeGroup.add(this.group);
          } else {
            mainScene.add(this.group);
          }
        }

        update(delta) {
          // 1. Growth Scaling (1.8 Seconds)
          if (this.growthProgress < 1.0) {
            this.growthProgress += delta / this.duration;
            if (this.growthProgress > 1.0) this.growthProgress = 1.0;
            const s = Math.sin(this.growthProgress * Math.PI * 0.5);
            this.group.scale.set(s, s, s);
          }

          // 2. Drift Motion across screen (Gitterbäume driften über das Bild)
          this.group.position.x += this.driftX * delta;
          this.group.position.y += this.driftY * delta;
          this.group.position.z += this.driftZ * delta;

          // Bounce off screen boundaries
          if (Math.abs(this.group.position.x) > 22.0) {
            this.driftX *= -1.0;
            this.group.position.x = Math.sign(this.group.position.x) * 22.0;
          }
          if (Math.abs(this.group.position.y) > 13.0) {
            this.driftY *= -1.0;
            this.group.position.y = Math.sign(this.group.position.y) * 13.0;
          }
          if (Math.abs(this.group.position.z) > 15.0) {
            this.driftZ *= -1.0;
            this.group.position.z = Math.sign(this.group.position.z) * 15.0;
          }
        }
      }

      function generateShapeNodes(shapeName, count) {
        const targets = [];

        if (shapeName === 'pyramide') {
          const h = 42.0;
          const b = 30.0;
          const keyVertices = [
            { tx: 0, ty: h * 0.65, tz: 0 },         // Apex
            { tx: -b, ty: -h * 0.35, tz: -b },      // Base corners
            { tx: b, ty: -h * 0.35, tz: -b },
            { tx: b, ty: -h * 0.35, tz: b },
            { tx: -b, ty: -h * 0.35, tz: b },
            { tx: 0, ty: -h * 0.35, tz: -b },       // Base midpoints
            { tx: b, ty: -h * 0.35, tz: 0 },
            { tx: 0, ty: -h * 0.35, tz: b },
            { tx: -b, ty: -h * 0.35, tz: 0 }
          ];
          for (let i = 0; i < count; i++) {
            if (i < keyVertices.length) {
              targets.push({ ...keyVertices[i], isCore: true });
            } else {
              targets.push({ tx: 0, ty: 0, tz: 0, isSurplus: true });
            }
          }
        } else if (shapeName === 'diamant') {
          const s = 40.0;
          const keyVertices = [
            { tx: 0, ty: s, tz: 0 },               // Top apex
            { tx: 0, ty: -s, tz: 0 },              // Bottom apex
            { tx: s * 0.85, ty: 0, tz: 0 },         // Equator ring
            { tx: 0, ty: 0, tz: s * 0.85 },
            { tx: -s * 0.85, ty: 0, tz: 0 },
            { tx: 0, ty: 0, tz: -s * 0.85 },
            { tx: s * 0.4, ty: s * 0.4, tz: s * 0.4 }, // Face midpoints
            { tx: -s * 0.4, ty: s * 0.4, tz: s * 0.4 },
            { tx: -s * 0.4, ty: -s * 0.4, tz: s * 0.4 },
            { tx: s * 0.4, ty: -s * 0.4, tz: s * 0.4 }
          ];
          for (let i = 0; i < count; i++) {
            if (i < keyVertices.length) {
              targets.push({ ...keyVertices[i], isCore: true });
            } else {
              targets.push({ tx: 0, ty: 0, tz: 0, isSurplus: true });
            }
          }
        } else if (shapeName === 'quadrat') {
          const c = 26.0;
          const corners = [
            { tx: -c, ty: -c, tz: -c },
            { tx: c, ty: -c, tz: -c },
            { tx: c, ty: c, tz: -c },
            { tx: -c, ty: c, tz: -c },
            { tx: -c, ty: -c, tz: c },
            { tx: c, ty: -c, tz: c },
            { tx: c, ty: c, tz: c },
            { tx: -c, ty: c, tz: c }
          ];
          const faceCenters = [
            { tx: 0, ty: 0, tz: c },
            { tx: 0, ty: 0, tz: -c },
            { tx: c, ty: 0, tz: 0 },
            { tx: -c, ty: 0, tz: 0 },
            { tx: 0, ty: c, tz: 0 },
            { tx: 0, ty: -c, tz: 0 }
          ];
          const keyVertices = [...corners, ...faceCenters];
          for (let i = 0; i < count; i++) {
            if (i < keyVertices.length) {
              targets.push({ ...keyVertices[i], isCore: true });
            } else {
              targets.push({ tx: 0, ty: 0, tz: 0, isSurplus: true });
            }
          }
        } else {
          const radius = 35.0;
          const phi = (1 + Math.sqrt(5)) / 2;
          const keyVertices = [];
          for (let i = 0; i < Math.min(12, count); i++) {
            const y = 1 - (i / 11) * 2;
            const r = Math.sqrt(Math.max(0, 1 - y * y)) * radius;
            const theta = 2 * Math.PI * i / phi;
            keyVertices.push({
              tx: Math.cos(theta) * r,
              ty: y * radius,
              tz: Math.sin(theta) * r
            });
          }
          for (let i = 0; i < count; i++) {
            if (i < keyVertices.length) {
              targets.push({ ...keyVertices[i], isCore: true });
            } else {
              targets.push({ tx: 0, ty: 0, tz: 0, isSurplus: true });
            }
          }
        }
        return targets;
      }

      function triggerPlexusShapeTransform(cluster, shapeName = null, shouldBroadcast = true) {
        if (!cluster || !cluster.nodes) return;
        const shapes = ['kugel', 'pyramide', 'diamant', 'quadrat'];
        const chosenShape = shapeName || shapes[Math.floor(Math.random() * shapes.length)];
        const shapeLabels = {
          kugel: '🔮 Kugel-Form',
          pyramide: '🔺 Pyramiden-Form',
          diamant: '💎 Diamanten-Form',
          quadrat: '🔷 Quadrat-Form'
        };

        cluster.targetShapeNodes = generateShapeNodes(chosenShape, cluster.nodes.length);
        cluster.targetShapeName = chosenShape;
        cluster.isTransforming = true;
        cluster.transformTimer = 0.0;
        cluster.transformDuration = 3.0;

        showToast(`Plexus Transformation: ${shapeLabels[chosenShape] || chosenShape}`);

        if (shouldBroadcast) {
          broadcastState('PLEXUS_SHAPE', { clusterId: cluster.id, shapeName: chosenShape });
        }
      }

      // Reduced size & compact node count (14 to 17 nodes, 15 to 55px radius)
      function generateRandomPlexusHoldNodes() {
        const nodes = [];
        const nodeCount = 14 + Math.floor(Math.random() * 4); // 14-17 nodes per plexus

        for (let i = 0; i < nodeCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 15.0 + Math.random() * 45.0; // Compact size (15 to 60px)
          const heightZ = (Math.random() - 0.5) * 35.0;

          nodes.push({
            dx: Math.cos(angle) * dist,
            dy: Math.sin(angle) * dist,
            dz: heightZ,
            freq: 0.8 + Math.random() * 1.5,
            phase: Math.random() * Math.PI * 2,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 3.0
          });
        }
        return nodes;
      }

      function createDriftingPlexusCluster(x, y, z, customNodes) {
        const nodes = customNodes || generateRandomPlexusHoldNodes();

        const clusterId = activePlexusClusters.length + 1;
        const dirX = (activePlexusClusters.length % 2 === 0) ? 1 : -1;
        const dirY = (activePlexusClusters.length % 3 === 0) ? 1 : -1;

        activePlexusClusters.push({
          id: clusterId,
          centerX: x,
          centerY: y,
          centerZ: z,
          driftX: (12.0 + Math.random() * 18.0) * dirX,
          driftY: (10.0 + Math.random() * 16.0) * dirY,
          driftZ: (8.0 + Math.random() * 14.0) * dirX,
          nodes: nodes,
          r: 1.0,
          g: 0.16 + Math.random() * 0.35,
          b: 0.62 + Math.random() * 0.35
        });
      }

      function emitStarParticle(x, y, z, r, g, b, scale) {

        tpNextFreeIndex = (tpNextFreeIndex + 1) % MAX_TRAIL_PARTICLES;

        tpVX[idx] = (Math.random() - 0.5) * 10.0;
        tpVY[idx] = (Math.random() - 0.5) * 10.0;
        tpVZ[idx] = (Math.random() - 0.5) * 10.0;

        tpLife[idx] = 0.0;
        tpMaxLife[idx] = 0.8 + Math.random() * 0.6;
        tpSize[idx] = (22.0 + Math.random() * 24.0) * scale;

        tpR[idx] = r;
        tpG[idx] = g;
        tpB[idx] = b;
        tpAlpha[idx] = 1.0;
        tpRot[idx] = Math.random() * Math.PI * 2;
      }

      // Massive High-Velocity Supernova Explosion Particle Emitter (Giant 4-Pointed Starburst Flares!)
      function emitExplosionStarParticle(x, y, z, vx, vy, vz) {
        const idx = tpNextFreeIndex;
        tpNextFreeIndex = (tpNextFreeIndex + 1) % MAX_TRAIL_PARTICLES;

        tpX[idx] = x;
        tpY[idx] = y;
        tpZ[idx] = z;

        tpVX[idx] = vx;
        tpVY[idx] = vy;
        tpVZ[idx] = vz;

        tpLife[idx] = 0.0;
        tpMaxLife[idx] = 2.2 + Math.random() * 1.5; // Lingers on screen for up to 3.7s
        tpSize[idx] = 70.0 + Math.random() * 85.0; // Giant glowing star flares!

        const colorType = Math.floor(Math.random() * 4);
        if (colorType === 0) {
          // White Hot Core
          tpR[idx] = 1.9; tpG[idx] = 1.8; tpB[idx] = 2.0;
        } else if (colorType === 1) {
          // Neon Cyan Glow
          tpR[idx] = 0.2; tpG[idx] = 1.8; tpB[idx] = 2.0;
        } else if (colorType === 2) {
          // Luminous Pink-Magenta
          tpR[idx] = 2.0; tpG[idx] = 0.2; tpB[idx] = 1.6;
        } else {
          // Solar Gold Glow
          tpR[idx] = 2.0; tpG[idx] = 1.6; tpB[idx] = 0.3;
        }

        tpAlpha[idx] = 1.0;
        tpRot[idx] = Math.random() * Math.PI * 2;
      }

      let isDraggingBranch = false;
      let activeDragBranchOrb = null;

      let generalHoldStartTime = 0;

      function onMouseDown(e) {
        if (!isArtworkStarted || isPaused) return;
        if (e.target.closest('.hud-layer') || e.target.closest('button')) return;

        isMouseDown = true;
        generalHoldStartTime = performance.now();

        triggerCursorGesture(activeUserIndex, 'mousedown');
        broadcastState('GESTURE', { gestureType: 'mousedown' });

        const currentPos = (activeUserIndex === 1) ? mouseWorld.clone() : user2WorldPos.clone();

        if (activeMode === 'bluten' || activeMode === 'wald') {
          if (roundState === 'ACTIVE') {
            if (currentPhase === 'PETAL') {
              for (let i = 0; i < activeOrbs.length; i++) {
                const orb = activeOrbs[i];
                if (orb.active && !orb.userDrawn && orb.type === 'petal' && orb.alpha > 0.2) {
                  if (currentPos.distanceTo(orb.position) < 1.35) {
                    spawnPetalsFromOrb(orb);
                    break;
                  }
                }
              }
            } else if (currentPhase === 'BLOSSOM') {
              if (roundClusterCount < MAX_CLUSTERS_PER_ROUND) {
                for (let i = 0; i < activeOrbs.length; i++) {
                  const orb = activeOrbs[i];
                  if (orb.active && !orb.userDrawn && orb.type === 'blossom' && orb.alpha > 0.2) {
                    if (currentPos.distanceTo(orb.position) < 1.35) {
                      spawnBlossomClusterFromOrb(orb);
                      break;
                    }
                  }
                }
              }
            } else if (currentPhase === 'BRANCH') {
              if (roundBranchCount < MAX_BRANCHES_PER_ROUND) {
                for (let i = 0; i < activeOrbs.length; i++) {
                  const orb = activeOrbs[i];
                  if (orb.active && !orb.userDrawn && orb.type === 'branch' && orb.alpha > 0.2 && orb.level < MAX_SUBBRANCH_EXTENSIONS) {
                    if (currentPos.distanceTo(orb.position) < 1.35) {
                      isDraggingBranch = true;
                      activeDragBranchOrb = orb;
                      break;
                    }
                  }
                }
              }
            }
          }
        }

        if (activeMode === 'plexus' || activeMode === 'wald') {
          draggedPlexusCluster = null;

          for (let i = 0; i < activePlexusClusters.length; i++) {
            const cluster = activePlexusClusters[i];
            const dx = cluster.centerX - currentPos.x;
            const dy = cluster.centerY - currentPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist <= 75.0) {
              draggedPlexusCluster = cluster;
              dragOffset.set(dx, dy);
              triggerPlexusShapeTransform(cluster);
              break;
            }
          }

          if (draggedPlexusCluster) {
            isMouseDown = true;
          } else {
            isMouseDown = true;
            plexusHoldTime = 0.0;
            activeHoldNodes = generateRandomPlexusHoldNodes();
            plexusOriginX = currentPos.x;
            plexusOriginY = currentPos.y;
          }
        }
      }

      function onMouseUp() {
        if (!isArtworkStarted) return;

        triggerCursorGesture(activeUserIndex, 'mouseup');
        broadcastState('GESTURE', { gestureType: 'mouseup' });

        isDraggingBranch = false;
        activeDragBranchOrb = null;

        const holdSecs = (performance.now() - generalHoldStartTime) / 1000.0;
        if (isMouseDown && holdSecs >= 2.0) {
          const spawnPos = (activeUserIndex === 1) ? mouseWorld.clone() : user2WorldPos.clone();
          spawnGridTreeAt(spawnPos);
          broadcastState('SPAWN_GRID_TREE', { x: spawnPos.x, y: spawnPos.y, z: spawnPos.z });
        }

        if (isMouseDown && (activeMode === 'plexus' || activeMode === 'wald')) {
          if (!draggedPlexusCluster) {
            if (plexusHoldTime >= 2.0) {
              createDriftingPlexusCluster(plexusOriginX, plexusOriginY, 0.0, activeHoldNodes);

              const normX = mouseScreen.x;
              const normY = mouseScreen.y;
              broadcastState('PLEXUS_CREATE', { normX, normY, customNodes: activeHoldNodes });

              if (!isPlexusCompleted) {
                isPlexusCompleted = true;
                checkUnlockWald();
              }
            }
          }
        }
        isMouseDown = false;
        draggedPlexusCluster = null;
      }

      function handleRemoteCanvasClick(data) {
        if (!isArtworkStarted || isPaused) return;
        const remoteUserIdx = data.senderIndex || (data.role === 'host' ? 1 : 2);
        triggerCursorGesture(remoteUserIdx, 'click');

        if (activeMode !== 'bluten' && activeMode !== 'wald') return;

        let clickPos = new THREE.Vector3();
        if (camera && data.normX !== undefined) {
          const vector = new THREE.Vector3(data.normX * 2 - 1, data.normY * 2 - 1, 0.5);
          vector.unproject(camera);
          const dir = vector.sub(camera.position).normalize();
          const dist = -camera.position.z / dir.z;
          clickPos.copy(camera.position).add(dir.multiplyScalar(dist));
        }

        if (roundState === 'ACTIVE') {
          for (let i = 0; i < activeOrbs.length; i++) {
            const orb = activeOrbs[i];
            if (orb.active && !orb.userDrawn && orb.alpha > 0.2) {
              if (clickPos.distanceTo(orb.position) < 1.35) {
                if (orb.type === 'petal') spawnPetalsFromOrb(orb);
                else if (orb.type === 'blossom') spawnBlossomClusterFromOrb(orb);
                else if (orb.type === 'branch') spawnSubBranchFromOrb(orb);
                break;
              }
            }
          }
        }
      }

      function onCanvasClick(e) {
        if (!isArtworkStarted || isPaused) return;
        if (e.target === createArtBtn || e.target.closest('#createArtBtn') || e.target === userSwitchBtn || e.target.closest('#userSwitchBtn') || e.target.closest('.mode-selector-container')) return;

        const normX = e.clientX / window.innerWidth;
        const normY = 1.0 - (e.clientY / window.innerHeight);

        triggerCursorGesture(activeUserIndex, 'click');
        broadcastState('GESTURE', { gestureType: 'click' });
        broadcastState('CANVAS_CLICK', { normX, normY });

        if (activeMode !== 'bluten' && activeMode !== 'wald') return;

        const currentPos = (activeUserIndex === 1) ? mouseWorld.clone() : user2WorldPos.clone();

        if (roundState === 'ACTIVE') {
          for (let i = 0; i < activeOrbs.length; i++) {
            const orb = activeOrbs[i];
            if (orb.active && !orb.userDrawn && orb.alpha > 0.2) {
              if (currentPos.distanceTo(orb.position) < 1.35) {
                if (orb.type === 'petal') spawnPetalsFromOrb(orb);
                else if (orb.type === 'blossom') spawnBlossomClusterFromOrb(orb);
                else if (orb.type === 'branch') spawnSubBranchFromOrb(orb);
                break;
              }
            }
          }
        }
      }

      function triggerOrbBurst(orb) {
        const totalTime = clock.getElapsedTime();
        const startPetalIndex = activePetalCount;
        const newPetalCount = Math.min(MAX_PETALS, activePetalCount + 5);

        let burstType = 0; // 0 = Standard, 1 = Dark Pink + Trail (Same User), 2 = Bright Pink-White + Trail (Collaborative)

        if (orb.clickCount === 2) {
          if (orb.secondClickUser === orb.owner) {
            burstType = 1; // Same User second click -> Dark Pink with Trail
          } else {
            burstType = 2; // Other User second click -> Bright Pink-White with Trail (Collaborative Boost!)
          }
        }

        for (let i = startPetalIndex; i < newPetalCount; i++) {
          // Spawns EXACTLY AT THE ORB'S CENTER (orb.x, orb.y)!
          petalSpawnOriginX[i] = orb.x;
          petalSpawnOriginY[i] = orb.y;
          petalSpawnTime[i] = totalTime;

          petalOrbitalRadiusX[i] = 60 + Math.random() * 140;
          petalOrbitalRadiusY[i] = 45 + Math.random() * 105;

          const dir = (i % 2 === 0) ? 1 : -1;
          petalOrbitalSpeed[i] = (0.2 + Math.random() * 0.4) * dir;
          petalOrbitalAngle[i] = Math.random() * Math.PI * 2;
          petalPhaseZ[i] = Math.random() * Math.PI * 2;

          petalTiltX[i] = (Math.random() - 0.5) * 0.9;
          petalTiltY[i] = (Math.random() - 0.5) * 0.9;
          petalType[i] = burstType;

          petalBaseScales[i] = 0.45 + Math.random() * 0.45;

          if (burstType === 1) {
            // Dark Pink
            petalColorsR[i] = 0.90;
            petalColorsG[i] = 0.05;
            petalColorsB[i] = 0.45;
          } else if (burstType === 2) {
            // Bright Pink-White
            petalColorsR[i] = 1.00;
            petalColorsG[i] = 0.85;
            petalColorsB[i] = 0.95;
          } else {
            // Standard Pink
            petalColorsR[i] = 1.00;
            petalColorsG[i] = 0.55;
            petalColorsB[i] = 0.85;
          }
        }

        activePetalCount = newPetalCount;
      }

      function onMouseMove(event) {
        const normX = event.clientX / window.innerWidth;
        const normY = 1.0 - (event.clientY / window.innerHeight);

        mouseScreen.x = normX;
        mouseScreen.y = normY;

        // Position current local user cursor element
        const activeCursor = document.getElementById(activeUserIndex === 1 ? 'userCursor1' : 'userCursor2');
        if (activeCursor) {
          activeCursor.style.left = `${event.clientX}px`;
          activeCursor.style.top = `${event.clientY}px`;
          if (isArtworkStarted) {
            activeCursor.classList.add('active');
          }
        }

        // Ensure both cursors are active and visible ONLY when artwork is started
        if (isArtworkStarted && (isGuestJoined || myRole === 'guest')) {
          const cursor1 = document.getElementById('userCursor1');
          const cursor2 = document.getElementById('userCursor2');
          if (cursor1) cursor1.classList.add('active');
          if (cursor2) cursor2.classList.add('active');
        }

        // Update 3D World position for local active user
        if (camera) {
          const vector = new THREE.Vector3(
            normX * 2 - 1,
            normY * 2 - 1,
            0.5
          );
          vector.unproject(camera);
          const dir = vector.sub(camera.position).normalize();
          const distance = -camera.position.z / dir.z;
          const pos = camera.position.clone().add(dir.multiplyScalar(distance));
          if (activeUserIndex === 1) {
            mouseWorld.copy(pos);
          } else {
            user2WorldPos.copy(pos);
          }
        }

        // Update dragged plexus cluster position and broadcast drag position
        if (isMouseDown && draggedPlexusCluster && (activeMode === 'plexus' || activeMode === 'wald')) {
          const currentPos = (activeUserIndex === 1) ? mouseWorld.clone() : user2WorldPos.clone();
          draggedPlexusCluster.centerX = currentPos.x + dragOffset.x;
          draggedPlexusCluster.centerY = currentPos.y + dragOffset.y;
          broadcastState('PLEXUS_DRAG', { clusterId: draggedPlexusCluster.id, normX, normY });
        }

        // Check if dragging a Sumi-e branch orb in branch phase
        if ((activeMode === 'bluten' || activeMode === 'wald') && currentPhase === 'BRANCH' && isDraggingBranch && activeDragBranchOrb && !activeDragBranchOrb.userDrawn) {
          const currentPos = (activeUserIndex === 1) ? mouseWorld.clone() : user2WorldPos.clone();
          const dragVec = new THREE.Vector3().subVectors(currentPos, activeDragBranchOrb.position);
          const dist = dragVec.length();

          if (dist > 0.40) {
            const dragDir = dragVec.clone().normalize();
            const dot = dragDir.dot(activeDragBranchOrb.guideDir);

            if (dot > 0.15) {
              spawnSubBranchFromOrb(activeDragBranchOrb);
              isDraggingBranch = false;
              activeDragBranchOrb = null;
            }
          }
        }

        // Broadcast local cursor move to other screens / tabs
        broadcastState('CURSOR_MOVE', {
          normX: normX,
          normY: normY
        });
      }

      function onWindowResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        bgRenderer.setPixelRatio(1.0);
        bgRenderer.setSize(w, h);
        bgUniforms.iResolution.value.set(w, h, 1);

        if (camera && mainRenderer) {
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          mainRenderer.setSize(w, h);
          updateCameraDistance();
        }
      }

      let activeAnimTime = 0.0;

      function animate() {
        requestAnimationFrame(animate);

        const realDelta = clock.getDelta();
        if (isPaused) {
          updateInstructionUI();
          bgRenderer.render(bgScene, bgCamera);
          if (mainRenderer && mainScene && camera) {
            mainRenderer.render(mainScene, camera);
          }
          return;
        }

        const delta = realDelta;
        activeAnimTime += delta;
        const totalTime = activeAnimTime;

        // 1. Background Metallic Shibuya Magenta Shader
        bgUniforms.iTime.value = totalTime;

        let targetKaleido = 0.0;
        if (activeMode !== 'bluten' && (activePetalCount >= 50 || isVortexActive)) {
          targetKaleido = Math.min(1.0, (activePetalCount - 50) / 25.0 + 0.5);
          if (isVortexActive) targetKaleido = 1.0;
        }
        bgUniforms.uKaleidoscope.value += (targetKaleido - bgUniforms.uKaleidoscope.value) * 0.05;

        let targetGridVibe = (activeMode !== 'bluten' && isPlexusSphereActive) ? 1.0 : 0.0;
        bgUniforms.uGridVibe.value += (targetGridVibe - bgUniforms.uGridVibe.value) * 0.05;

        bgRenderer.render(bgScene, bgCamera);

        // If artwork has not been started from lobby overlay, do not update 3D physics!
        if (!isArtworkStarted) return;

        // 2. Artwork Completion Counter UI Update (0/3 to 3/3)
        updateArtworkCounterUI();

        // 2. Sumi-e Branch, Blossom & Petal Physics Update (Only active if activeMode === 'bluten')
        if (activeMode === 'bluten') {
          if (!isPaused && isRippleActive) {
            rippleTimer += delta;
            if (bgUniforms.uRippleTime) bgUniforms.uRippleTime.value = rippleTimer;
            if (rippleTimer >= RIPPLE_DURATION) {
              isRippleActive = false;
              if (bgUniforms.uRippleActive) bgUniforms.uRippleActive.value = 0.0;
            }
          }

          // Animiere Sumi-e Branch Strokes (Main Trunk & Subbranches)
          allBranches.forEach(bInfo => {
            if (bInfo.stroke) bInfo.stroke.setTime(totalTime);
          });
          persistentBlossomStrokes.forEach(stroke => {
            stroke.setTime(totalTime);
          });

          // Stammwuchs
          if (growthProgress < 1.0) {
            growthProgress += delta / growthDuration;
            if (growthProgress > 1.0) growthProgress = 1.0;
            updateTrunkGrowth(growthProgress);
          }

          if (growthProgress >= 1.0) {
            if (!trunkCompleted) {
              trunkCompleted = true;
              trunkPostDelayTimer = 0.0;
            } else if (currentRound === 0 && roundState === 'IDLE') {
              trunkPostDelayTimer += delta;
              if (trunkPostDelayTimer >= TRUNK_POST_DELAY) {
                spawnOrbRound(1, 'BRANCH');
              }
            }
          }

          // Animiere Subbranches (3.0s)
          for (let i = growingSubBranches.length - 1; i >= 0; i--) {
            const item = growingSubBranches[i];
            item.progress += delta / item.duration;
            if (item.progress > 1.0) item.progress = 1.0;
            item.stroke.setProgress(item.progress);
            if (item.progress >= 1.0) {
              growingSubBranches.splice(i, 1);
            }
          }

          // Animiere Blüten-Cluster (0.5s)
          for (let i = growingBlossomClusters.length - 1; i >= 0; i--) {
            const item = growingBlossomClusters[i];
            item.progress += delta / item.duration;
            if (item.progress > 1.0) item.progress = 1.0;
            item.stroke.setProgress(item.progress);
            if (item.progress >= 1.0) {
              growingBlossomClusters.splice(i, 1);
            }
          }

          // Vortex Interpolation (5s Aufbau, 5s Wirbel, 5s Abbau)
          if (isVortexActive) {
            vortexTimer += delta;
            if (vortexTimer < VORTEX_BUILD_TIME) {
              vortexBlendFactor = vortexTimer / VORTEX_BUILD_TIME;
            } else if (vortexTimer <= (VORTEX_BUILD_TIME + VORTEX_HOLD_TIME)) {
              vortexBlendFactor = 1.0;
            } else if (vortexTimer <= VORTEX_TOTAL_DURATION) {
              vortexBlendFactor = 1.0 - ((vortexTimer - (VORTEX_BUILD_TIME + VORTEX_HOLD_TIME)) / VORTEX_FADE_TIME);
            } else {
              isVortexActive = false;
              vortexBlendFactor = 0.0;

              if (!isBlütenCompleted) {
                isBlütenCompleted = true;
                markArtworkCompleted('bluten');
                checkUnlockWald();
              }
            }
          } else {
            vortexBlendFactor = 0.0;
          }

          floating2DPetals.forEach(petal => petal.update(delta, totalTime));

          // Round State Machine
          if (roundState !== 'IDLE') {
            roundTimer += delta;
            const activeTimeLimit = (currentPhase === 'PETAL') ? ROUND_ACTIVE_TIME_PETAL : ROUND_ACTIVE_TIME_DEFAULT;

            if (currentPhase === 'PETAL') {
              updateTrunkGrowth(1.0);
            }

            if (roundState === 'ACTIVE') {
              activeOrbs.forEach(orb => {
                if (orb.roundId === currentRound && !orb.userDrawn && !orb.isExploding) {
                  orb.setAlpha(Math.min(1.0, orb.alpha + delta * 3.0));
                }
                orb.update(totalTime, delta);
              });

              if (roundTimer >= activeTimeLimit) {
                roundState = 'FADING';
                roundTimer = 0.0;
              }
            } else if (roundState === 'FADING') {
              activeOrbs.forEach(orb => {
                if (orb.roundId === currentRound && !orb.isExploding) {
                  orb.setAlpha(Math.max(0.0, orb.alpha - delta * 2.0));
                }
                orb.update(totalTime, delta);
              });

              if (roundTimer >= ROUND_FADE_TIME) {
                roundState = 'PAUSE';
                roundTimer = 0.0;
              }
            } else if (roundState === 'PAUSE') {
              if (roundTimer >= ROUND_PAUSE_TIME) {
                if (currentRound < maxRoundsPerPhase && currentPhase !== 'PETAL') {
                  spawnOrbRound(currentRound + 1, currentPhase);
                } else {
                  if (currentPhase === 'BRANCH') {
                    spawnOrbRound(1, 'BLOSSOM');
                  } else if (currentPhase === 'BLOSSOM') {
                    spawnOrbRound(1, 'PETAL');
                  } else {
                    roundState = 'IDLE';
                  }
                }
              }
            }
          }
        }

        // 6. Persistent Drifting Glowing Star Plexus Constellations (Implosion & Supernova Explosion Event!)
        if (activeMode === 'plexus' || activeMode === 'wald') {
          const linePosAttr = plexusLinesMesh.geometry.attributes.position;
          const lineColAttr = plexusLinesMesh.geometry.attributes.color;
          const linePositions = linePosAttr.array;
          const lineColors = lineColAttr.array;

          const nodePosAttr = plexusPointsMesh.geometry.attributes.position;
          const nodeColAttr = plexusPointsMesh.geometry.attributes.color;
          const nodeSizeAttr = plexusPointsMesh.geometry.attributes.size;
          const nodeRotAttr = plexusPointsMesh.geometry.attributes.rotAngle;

          const nodePositions = nodePosAttr.array;
          const nodeColors = nodeColAttr.array;
          const nodeSizes = nodeSizeAttr.array;
          const nodeRotations = nodeRotAttr.array;

          const currentPos = (activeUserIndex === 1) ? mouseWorld : user2WorldPos;

          // Dragging vs Growing Mode Handling
          if (isMouseDown) {
            if (draggedPlexusCluster) {
              // DRAG EXISTING PLEXUS CLUSTER TO CURSOR
              draggedPlexusCluster.centerX = currentPos.x + dragOffset.x;
              draggedPlexusCluster.centerY = currentPos.y + dragOffset.y;
            } else {
              // GROW NEW PLEXUS CLUSTER AT CURSOR
              plexusHoldTime += delta;
              plexusOriginX = currentPos.x;
              plexusOriginY = currentPos.y;

              if (plexusHoldTime >= 2.0 && !isPlexusCompleted) {
                isPlexusCompleted = true;
                checkUnlockWald();
              }
            }
          }

          const allWorldNodes = [];

          // Include the currently growing randomized plexus around cursor if holding down (and not dragging)!
          if (isMouseDown && !draggedPlexusCluster && activeHoldNodes.length > 0) {
            const progress = Math.min(1.0, plexusHoldTime / 2.0);
            const activeCount = Math.floor(progress * activeHoldNodes.length);

            for (let n = 0; n < activeCount; n++) {
              const node = activeHoldNodes[n];
              node.rot += delta * node.rotSpeed;

              const wx = plexusOriginX + node.dx * progress + Math.sin(totalTime * node.freq + node.phase) * 10.0;
              const wy = plexusOriginY + node.dy * progress + Math.cos(totalTime * node.freq + node.phase) * 10.0;
              const wz = node.dz * progress;

              allWorldNodes.push({
                x: wx, y: wy, z: wz,
                r: 1.0, g: 0.18, b: 0.65,
                size: 15.0 * progress,
                rot: node.rot,
                clusterId: 0
              });
            }
          }

          // Update & drift active persistent Plexus clusters across screen
          const safeMarginX = 350.0;
          const safeMarginY = 220.0;

          for (let c = 0; c < activePlexusClusters.length; c++) {
            const cluster = activePlexusClusters[c];

            if (cluster !== draggedPlexusCluster && !isPlexusSphereActive) {
              cluster.centerX += cluster.driftX * delta;
              cluster.centerY += cluster.driftY * delta;
              cluster.centerZ += cluster.driftZ * delta;

              if (cluster.centerX > safeMarginX) {
                cluster.driftX = -Math.abs(cluster.driftX);
                cluster.centerX = safeMarginX;
              } else if (cluster.centerX < -safeMarginX) {
                cluster.driftX = Math.abs(cluster.driftX);
                cluster.centerX = -safeMarginX;
              }

              if (cluster.centerY > safeMarginY) {
                cluster.driftY = -Math.abs(cluster.driftY);
                cluster.centerY = safeMarginY;
              } else if (cluster.centerY < -safeMarginY) {
                cluster.driftY = Math.abs(cluster.driftY);
                cluster.centerY = -safeMarginY;
              }

              if (Math.abs(cluster.centerZ) > 100.0) {
                cluster.driftZ *= -1.0;
                cluster.centerZ = Math.sign(cluster.centerZ) * 100.0;
              }
            }

            // Shape Transformation Lerp Calculation (3 Seconds)
            let isTransformActive = false;
            let blendFactor = 0.0;
            let spinAngle = 0.0;

            if (cluster.isTransforming && cluster.targetShapeNodes) {
              cluster.transformTimer += delta;
              const totalDur = cluster.transformDuration || 3.0;
              if (cluster.transformTimer >= totalDur) {
                cluster.isTransforming = false;
                cluster.transformTimer = 0.0;
              } else {
                isTransformActive = true;
                const p = cluster.transformTimer / totalDur;
                if (p < 0.16) blendFactor = p / 0.16;
                else if (p > 0.84) blendFactor = (1.0 - p) / 0.16;
                else blendFactor = 1.0;
                blendFactor = blendFactor * blendFactor * (3.0 - 2.0 * blendFactor);
                spinAngle = cluster.transformTimer * 1.8;
              }
            }

            const cosY = Math.cos(spinAngle);
            const sinY = Math.sin(spinAngle);

            for (let i = 0; i < cluster.nodes.length; i++) {
              const node = cluster.nodes[i];
              node.rot += delta * node.rotSpeed;

              let offsetDx = node.dx;
              let offsetDy = node.dy;
              let offsetDz = node.dz;
              let nodeSize = 15.0;

              if (isTransformActive && cluster.targetShapeNodes[i]) {
                const target = cluster.targetShapeNodes[i];
                const rx = target.tx * cosY - target.tz * sinY;
                const rz = target.tx * sinY + target.tz * cosY;
                const ry = target.ty;

                offsetDx = THREE.MathUtils.lerp(node.dx, rx, blendFactor);
                offsetDy = THREE.MathUtils.lerp(node.dy, ry, blendFactor);
                offsetDz = THREE.MathUtils.lerp(node.dz, rz, blendFactor);

                if (target.isSurplus) {
                  nodeSize = THREE.MathUtils.lerp(15.0, 0.0, blendFactor);
                } else {
                  nodeSize = THREE.MathUtils.lerp(15.0, 18.0, blendFactor);
                }
              }

              const wobbleFactor = 1.0 - blendFactor;
              const wx = cluster.centerX + offsetDx + wobbleFactor * Math.sin(totalTime * node.freq + node.phase) * 12.0;
              const wy = cluster.centerY + offsetDy + wobbleFactor * Math.cos(totalTime * node.freq + node.phase) * 12.0;
              const wz = cluster.centerZ + offsetDz + wobbleFactor * Math.sin(totalTime * 0.9 + node.phase * 1.5) * 18.0;

              allWorldNodes.push({
                x: wx, y: wy, z: wz,
                r: cluster.r, g: cluster.g, b: cluster.b,
                size: nodeSize,
                rot: node.rot,
                clusterId: cluster.id
              });
            }
          }

          // Step 1: Build Adjacency Graph to measure Connected Graph Component sizes via BFS
          const maxConnectDist = 95.0;
          const clusterMap = new Map();

          for (let c = 0; c < activePlexusClusters.length; c++) {
            clusterMap.set(activePlexusClusters[c].id, new Set());
          }

          for (let i = 0; i < allWorldNodes.length; i++) {
            for (let j = i + 1; j < allWorldNodes.length; j++) {
              const nodeA = allWorldNodes[i];
              const nodeB = allWorldNodes[j];

              if (nodeA.clusterId > 0 && nodeB.clusterId > 0 && nodeA.clusterId !== nodeB.clusterId) {
                const dx = nodeA.x - nodeB.x;
                const dy = nodeA.y - nodeB.y;
                const dz = nodeA.z - nodeB.z;
                const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                if (dist < maxConnectDist) {
                  if (clusterMap.has(nodeA.clusterId)) clusterMap.get(nodeA.clusterId).add(nodeB.clusterId);
                  if (clusterMap.has(nodeB.clusterId)) clusterMap.get(nodeB.clusterId).add(nodeA.clusterId);
                }
              }
            }
          }

          // BFS Graph Search: Find the maximum connected component size and set of interconnected clusters
          let maxConnectedComponentSize = 0;
          const interconnectedClusters = new Set();
          const globalVisited = new Set();

          for (const [startClusterId] of clusterMap) {
            if (!globalVisited.has(startClusterId)) {
              const componentVisited = new Set();
              const queue = [startClusterId];
              componentVisited.add(startClusterId);
              globalVisited.add(startClusterId);

              while (queue.length > 0) {
                const curr = queue.shift();
                const neighbors = clusterMap.get(curr) || [];
                for (const neighborId of neighbors) {
                  if (!componentVisited.has(neighborId)) {
                    componentVisited.add(neighborId);
                    globalVisited.add(neighborId);
                    queue.push(neighborId);
                  }
                }
              }

              if (componentVisited.size >= 2) {
                for (const id of componentVisited) {
                  interconnectedClusters.add(id);
                }
              }

              if (componentVisited.size > maxConnectedComponentSize) {
                maxConnectedComponentSize = componentVisited.size;
              }
            }
          }

          if (maxConnectedComponentSize >= 8 && !isPlexusSphereActive && (activeMode === 'plexus' || activeMode === 'wald')) {
            isPlexusSphereActive = true;
            plexusSphereStartTime = totalTime;
            hasExplodedThisFrame = false;
          }

          // Execute 3D Sphere Transformation -> IMPLOSION -> GIANT SUPERNOVA EXPLOSION!
          if (isPlexusSphereActive) {
            const sphereAge = totalTime - plexusSphereStartTime;

            if (sphereAge >= 5.0) {
              // EXACTLY 5 SECONDS REACHED: RESET SCENE & UNLOCK WALD!
              isPlexusSphereActive = false;
              activePlexusClusters.length = 0;
              isPlexusCompleted = true;
              markArtworkCompleted('plexus');
              checkUnlockWald();
            } else {
              let sphereRadius = 145.0;

              if (sphereAge > 3.6 && sphereAge <= 4.3) {
                // IMPLOSION PHASE (3.6s to 4.3s): Rapidly shrink sphere down to ultra-dense core point!
                const implosionProgress = (sphereAge - 3.6) / 0.7;
                sphereRadius = THREE.MathUtils.lerp(145.0, 2.0, Math.pow(implosionProgress, 3.0));
              } else if (sphereAge > 4.3) {
                // EXPLOSION PHASE (4.3s to 5.0s): Core explodes outward into giant supernova particle shockwave!
                sphereRadius = 0.0;

                if (!hasExplodedThisFrame) {
                  hasExplodedThisFrame = true;
                  // Trigger massive 360-degree star particle burst explosion (450 giant glowing stars)!
                  for (let p = 0; p < 450; p++) {
                    const angle = Math.random() * Math.PI * 2;
                    const elevation = (Math.random() - 0.5) * Math.PI;
                    const speed = 250.0 + Math.random() * 650.0;

                    const vx = Math.cos(angle) * Math.cos(elevation) * speed;
                    const vy = Math.sin(angle) * Math.cos(elevation) * speed;
                    const vz = Math.sin(elevation) * speed;

                    emitExplosionStarParticle(0, 0, 0, vx, vy, vz);
                  }
                }
              }

              const spin = totalTime * (3.5 + (sphereAge > 3.6 ? (sphereAge - 3.6) * 16.0 : 0.0));
              const totalSphereNodes = allWorldNodes.length;

              for (let k = 0; k < totalSphereNodes; k++) {
                const theta = k * 2.39996 + spin;
                const yNorm = 1.0 - (k / Math.max(1, totalSphereNodes - 1)) * 2.0;
                const radiusAtY = Math.sqrt(Math.max(0.0, 1.0 - yNorm * yNorm)) * sphereRadius;

                const targetX = Math.cos(theta) * radiusAtY;
                const targetY = yNorm * sphereRadius;
                const targetZ = Math.sin(theta) * radiusAtY;

                const lerpPower = Math.pow(Math.min(1.0, sphereAge / 3.6), 1.2);
                allWorldNodes[k].x = THREE.MathUtils.lerp(allWorldNodes[k].x, targetX, lerpPower);
                allWorldNodes[k].y = THREE.MathUtils.lerp(allWorldNodes[k].y, targetY, lerpPower);
                allWorldNodes[k].z = THREE.MathUtils.lerp(allWorldNodes[k].z, targetZ, lerpPower);
              }
            }
          }

          // Populate Node Buffers
          for (let k = 0; k < MAX_TOTAL_NODES; k++) {
            if (k < allWorldNodes.length) {
              nodePositions[k * 3] = allWorldNodes[k].x;
              nodePositions[k * 3 + 1] = allWorldNodes[k].y;
              nodePositions[k * 3 + 2] = allWorldNodes[k].z;

              nodeColors[k * 3] = allWorldNodes[k].r;
              nodeColors[k * 3 + 1] = allWorldNodes[k].g;
              nodeColors[k * 3 + 2] = allWorldNodes[k].b;

              nodeSizes[k] = allWorldNodes[k].size;
              nodeRotations[k] = allWorldNodes[k].rot;
            } else {
              nodePositions[k * 3] = 0;
              nodePositions[k * 3 + 1] = 0;
              nodePositions[k * 3 + 2] = 0;
              nodeColors[k * 3] = 0;
              nodeColors[k * 3 + 1] = 0;
              nodeColors[k * 3 + 2] = 0;
              nodeSizes[k] = 0;
              nodeRotations[k] = 0;
            }
          }

          // Render Lines
          let lineVertexIdx = 0;
          let lineColorIdx = 0;

          for (let i = 0; i < allWorldNodes.length; i++) {
            for (let j = i + 1; j < allWorldNodes.length; j++) {
              if (lineVertexIdx >= linePositions.length - 6) break;

              const nodeA = allWorldNodes[i];
              const nodeB = allWorldNodes[j];

              const dx = nodeA.x - nodeB.x;
              const dy = nodeA.y - nodeB.y;
              const dz = nodeA.z - nodeB.z;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

              if (dist < maxConnectDist) {
                const alpha = (1.0 - dist / maxConnectDist) * 0.95;

                linePositions[lineVertexIdx++] = nodeA.x;
                linePositions[lineVertexIdx++] = nodeA.y;
                linePositions[lineVertexIdx++] = nodeA.z;

                linePositions[lineVertexIdx++] = nodeB.x;
                linePositions[lineVertexIdx++] = nodeB.y;
                linePositions[lineVertexIdx++] = nodeB.z;

                const isInterconnected = interconnectedClusters.has(nodeA.clusterId) || interconnectedClusters.has(nodeB.clusterId) || isPlexusSphereActive;

                let lineR, lineG, lineB;

                if (isInterconnected) {
                  // Vibrant Shifting Rainbow Colors when 2+ Plexus clusters connect!
                  const hueA = (totalTime * 2.5 + nodeA.clusterId * 1.2) % (Math.PI * 2);
                  const hueB = (totalTime * 2.5 + nodeB.clusterId * 1.2 + 1.5) % (Math.PI * 2);

                  lineR = (0.5 + 0.5 * Math.sin(hueA)) * 1.3;
                  lineG = (0.5 + 0.5 * Math.sin(hueA + 2.094)) * 1.3;
                  lineB = (0.5 + 0.5 * Math.sin(hueA + 4.188)) * 1.3;

                  var lineR2 = (0.5 + 0.5 * Math.sin(hueB)) * 1.3;
                  var lineG2 = (0.5 + 0.5 * Math.sin(hueB + 2.094)) * 1.3;
                  var lineB2 = (0.5 + 0.5 * Math.sin(hueB + 4.188)) * 1.3;
                } else {
                  // Standard Elegant Dark Magenta
                  lineR = 0.88; lineG = 0.08; lineB = 0.58;
                  var lineR2 = 0.88; var lineG2 = 0.08; var lineB2 = 0.58;
                }

                lineColors[lineColorIdx++] = lineR * alpha;
                lineColors[lineColorIdx++] = lineG * alpha;
                lineColors[lineColorIdx++] = lineB * alpha;

                lineColors[lineColorIdx++] = lineR2 * alpha;
                lineColors[lineColorIdx++] = lineG2 * alpha;
                lineColors[lineColorIdx++] = lineB2 * alpha;
              }
            }
          }

          // Clear remaining line buffers
          for (let k = lineVertexIdx; k < linePositions.length; k++) {
            linePositions[k] = 0;
            lineColors[k] = 0;
          }

          linePosAttr.needsUpdate = true;
          lineColAttr.needsUpdate = true;
          nodePosAttr.needsUpdate = true;
          nodeColAttr.needsUpdate = true;
          nodeSizeAttr.needsUpdate = true;
          nodeRotAttr.needsUpdate = true;
        }

        // Update Shining Star Trail Particles & Massive Supernova Explosion Particle Physics (Active in ALL Modes!)
        const tpPosAttr = trailPointsMesh.geometry.attributes.position;
        const tpColAttr = trailPointsMesh.geometry.attributes.color;
        const tpSizeAttr = trailPointsMesh.geometry.attributes.size;
        const tpAlphaAttr = trailPointsMesh.geometry.attributes.alpha;
        const tpRotAttr = trailPointsMesh.geometry.attributes.rotAngle;

        const tpPositions = tpPosAttr.array;
        const tpColors = tpColAttr.array;
        const tpSizes = tpSizeAttr.array;
        const tpAlphas = tpAlphaAttr.array;
        const tpRotAngles = tpRotAttr.array;

        for (let k = 0; k < MAX_TRAIL_PARTICLES; k++) {
          if (tpLife[k] < tpMaxLife[k]) {
            tpLife[k] += delta;
            const progress = tpLife[k] / tpMaxLife[k];

            // Velocity Drag / Air Resistance for Explosion Shockwave
            tpVX[k] *= 0.965;
            tpVY[k] *= 0.965;
            tpVZ[k] *= 0.965;

            tpX[k] += tpVX[k] * delta;
            tpY[k] += tpVY[k] * delta;
            tpZ[k] += tpVZ[k] * delta;

            tpRot[k] += delta * 3.0;

            tpPositions[k * 3] = tpX[k];
            tpPositions[k * 3 + 1] = tpY[k];
            tpPositions[k * 3 + 2] = tpZ[k];

            tpColors[k * 3] = tpR[k];
            tpColors[k * 3 + 1] = tpG[k];
            tpColors[k * 3 + 2] = tpB[k];

            tpAlphas[k] = Math.max(0.0, (1.0 - Math.pow(progress, 1.8)));
            tpSizes[k] = tpSize[k] * (1.0 - progress * 0.35);
            tpRotAngles[k] = tpRot[k];
          } else {
            tpSizes[k] = 0;
            tpAlphas[k] = 0;
          }
        }

        tpPosAttr.needsUpdate = true;
        tpColAttr.needsUpdate = true;
        tpSizeAttr.needsUpdate = true;
        tpAlphaAttr.needsUpdate = true;
        tpRotAttr.needsUpdate = true;

        updateAmbientSparkles(delta, totalTime);
        activeGridTrees.forEach(tree => tree.update(delta));

        mainRenderer.render(mainScene, camera);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
